function standingsTable(report,kind){const ds=kind==='teams'?report.teamStandings:report.driverStandings;return '<div class="table-wrap"><table><thead><tr><th>Platz</th><th>'+(kind==='teams'?'Team':'Fahrer')+'</th>'+(kind==='teams'?'':'<th>Team</th>')+'<th>Punkte</th><th>Siege</th></tr></thead><tbody>'+ds.map(d=>'<tr class="'+((kind==='teams'?d.id:d.teamId)===report.teamId?'you':'')+'"><td class="td-pos">'+d.position+'</td><td><span class="team-dot" style="background:'+d.color+'"></span> '+esc(d.name)+'</td>'+(kind==='teams'?'':'<td>'+esc(d.teamName)+'</td>')+'<td class="td-points">'+d.points+'</td><td>'+d.wins+'</td></tr>').join('')+'</tbody></table></div>';}
function reportBody(report,archived=false){return '<div class="stats">'+stat('Team-WM','P'+report.teamPosition,report.teamName,'cup')+stat('Punkte',report.points,report.wins+' Rennsiege','flag')+stat('Fahrerweltmeister',esc(report.driverStandings[0].name.split(' ').slice(-1)[0]),report.driverStandings[0].name,'user')+stat('Jahresbilanz',esc(compactMoney(report.finance.net)),'Nach sämtlichen Kosten','briefcase')+'</div><div class="row wrap mb16">'+(!archived&&S.phase==='summary'?btn('Nächste Saison vorbereiten '+icon('arrow'),'next'):'')+btn(icon('briefcase')+' Jahresabrechnung','report-finance',archived?String(selectedArchive):'latest','secondary')+'</div><div class="grid2"><section class="min0"><h3 class="mb16">Team-Weltmeisterschaft</h3>'+standingsTable(report,'teams')+'</section><section class="min0"><h3 class="mb16">Fahrer-Weltmeisterschaft</h3>'+standingsTable(report,'drivers')+'</section></div><h3 class="mt24 mb16">Deine Saison im Überblick</h3><div class="table-wrap"><table><thead><tr><th>Rennen</th><th>Sieger</th><th>Deine Fahrer</th><th>Ergebnis</th></tr></thead><tbody>'+report.results.map((r,i)=>{const us=r.rows.filter(d=>d.teamId===report.teamId);return '<tr><td>'+esc(r.track)+' '+icon(r.wet?'rain':'sun')+'</td><td>'+esc(r.rows[0].name)+'</td><td>'+us.map(d=>esc(d.name.split(' ').slice(-1)[0])+': '+(d.dnf?'DNF':'P'+d.position)).join(' · ')+'</td><td>'+btn('Ansehen','race',String(i),'small ghost','data-report="'+(archived?selectedArchive:'latest')+'"')+'</td></tr>';}).join('')+'</tbody></table></div>';}
function resultsPage(){if(!S.lastSeason)return pageHeading('SAISON / ERGEBNISSE','Deine erste Saison wartet.','Simuliere eine Saison, um Fahrer-WM, Team-WM und alle Rennergebnisse zu sehen.')+'<section class="panel">'+btn('Zur Teamübersicht '+icon('arrow'),'nav','overview')+'</section>';return pageHeading('FORMEL 1 / SAISON '+S.lastSeason.year,'Die Saison in Zahlen.',S.lastSeason.teamName+' · '+(S.phase==='prep'?'Letzte abgeschlossene Saison. Deine neue Saison wird erst nach der Simulation angezeigt.':'Alle Rennen sind simuliert und abgerechnet.'))+reportBody(S.lastSeason);}
function archivePage(){return pageHeading('DEIN TEAM / ARCHIV','Jede Saison hinterlässt Spuren.','Die letzten 30 Saisonberichte bleiben mit ihren damaligen Teams, Fahrern und Finanzen gespeichert.')+(S.archive.length?'<div class="stack">'+S.archive.map((r,i)=>'<section class="panel"><div class="row between wrap"><div><div class="eyebrow">SAISON '+r.year+'</div><h3 class="mt8">'+esc(r.teamName)+' · P'+r.teamPosition+'</h3><p class="muted mt8" style="font-size:12px">'+r.points+' Punkte · '+r.wins+' Siege · '+esc(compactMoney(r.finance.net))+' Bilanz</p></div>'+btn('Saison öffnen','archive',String(i),'secondary')+'</div></section>').join('')+'</div>':'<section class="panel"><p class="muted">Dein erster Saisonbericht wird nach der Simulation automatisch archiviert.</p></section>');}
function settings(){return pageHeading('SPIELMODUS / SICHERUNG','Dein Team. Deine Spielstände.','Manager und Fahrerkarriere bleiben getrennte Spielwelten.')+'<section class="panel"><div class="panel-header"><h3>Manager-Modus</h3>'+badge('AKTIV')+'</div><p class="muted" style="font-size:12px;line-height:1.8">Du leitest <b>'+esc(M.displayTeamName(S))+'</b>. Du wählst Fahrer und Verträge, finanzierst das Team und simulierst ganze Saisons. Kein einzelnes Rennen muss von dir gemanagt werden.</p>'+btn(icon('back')+' Zur Fahrerkarriere','career','','secondary mt16')+'<p class="faint mt8" style="font-size:11px">Deine Managerkarriere bleibt dabei erhalten. In der Fahrerkarriere stehen weiterhin Standard, Karriere-Fokus und Schnell zur Verfügung.</p></section><section class="panel mt24"><h3>Deine Sicherung</h3><p class="muted mt8" style="font-size:12px;line-height:1.8">Speicherung nur in dieser App beziehungsweise diesem Browser. Für Updates oder einen Gerätewechsel bitte exportieren. Ein Manager-Export enthält dein Team; die Fahrerkarriere exportierst du separat dort.</p><div class="row wrap mt16">'+btn(icon('download')+' Manager exportieren','export','','secondary')+btn(icon('upload')+' Manager importieren','import','','ghost')+'</div></section><section class="panel mt24"><h3>Neues Team, neuer Anfang</h3><p class="muted mt8" style="font-size:12px">Du hast drei getrennte Managerplätze. Wähle einen freien Platz für einen weiteren Rennstall.</p>'+btn('Neuen Manager beginnen','new','','ghost mt16')+'</section>';}
function render(){activate();const body=!S?setup():S.phase==='season-event'?shell(managementEventPage()):shell(({overview,development:()=>developmentPage()+E.carPanel(S,'manager'),organisation:()=>E.managerPage(S),drivers:driversPage,finance:financePage,results:resultsPage,archive:archivePage,settings:()=>settings()+E.slotEntry('manager')}[view]||overview)());$('#app').innerHTML=body;window.AufstiegReleaseUI.decorate('manager',S,view);}
function exportSave(){if(!S){toast('Starte zuerst einen Manager-Spielstand.',true);return;}E.portableDialog(M.serialize(S),'Manager-'+S.year,'Manager-Spielstand sichern');}
function offerImport(raw){try{const candidate=M.deserialize(raw);pendingImport=candidate;dialog('Manager-Spielstand laden?','<p><b>'+esc(M.team(candidate).name)+'</b> · Saison '+candidate.year+'</p><p>Nur der aktive Managerplatz wird ersetzt. Andere Managerplätze und Fahrerkarrieren bleiben unverändert.</p>',(S?btn('Aktuellen Manager exportieren','export','','ghost'):'')+btn('Abbrechen','cancel-import','','secondary')+btn('Manager übernehmen','accept-import'));}catch(e){pendingImport=null;toast(e.message,true);}}
function help(){dialog('Teamchef – so funktioniert’s','<h3>Neu in 0.15: echte Fahrerwelt für Teamchefs</h3><p>Fahrer besitzen jetzt individuelle Alterung, Marktwerte und verbindliche Verträge. Reservefahrer, Teamkollegen-Dynamik, Renningenieure sowie seltene Teamorder-, Konflikt-, Reserve- und Medienereignisse können deine Saison beeinflussen. Ablösen, Boni, Vertragsauflösungen und Reservekosten sind Teil der Teamfinanzen, ohne zusätzliches Mikromanagement am Auto.</p><h3>Einfach eine Mannschaft führen</h3><p><b>1. Fahrer:</b> Dein Team braucht zwei Cockpits. Im Fahrermarkt wählst du Fahrer, Cockpit, Jahresgehalt und 1–3 Saisons Vertragsdauer. Die angezeigte Mindestforderung muss erfüllt sein. Ablöse, Handgeld und eine mögliche Vertragsauflösung werden sofort bezahlt.</p><p><b>2. Sponsor:</b> Ein fiktiver Hauptsponsor pro Saison. Du siehst fünf jährlich wechselnde Angebote aus 21 Partnern; Nordlicht ist immer dabei. Die feste Zahlung ist garantiert. Der einmalige Saisonbonus hängt je nach Vertrag von Team-WM-Platzierung, Rennsiegen oder dem Teamtitel ab. Premium-Partner werden durch Erfolge in den letzten drei abgeschlossenen Saisons freigeschaltet; geprüft wird ab der nächsten Saisonvorbereitung. Im Sponsoren-Katalog siehst du alle Bedingungen. Unterschriebene Verträge gelten eine Saison und werden nicht geändert.</p><p><b>3. Budget:</b> Die Vorschau rechnet mit Grundfinanzierung, festem Sponsorgeld und Mindestpreisgeld, ohne Erfolgsbonus. Gehälter und Betriebskosten werden jährlich abgezogen. Zwei Entwicklungsplätze pro Saison stehen für Tempo oder Zuverlässigkeit zur Verfügung. Gute Autos gewinnen weniger durch weitere Pakete. Unter Team → Zentrale & Forschung findest du Gebäude mit jährlicher Wartung, Forschung für das Folgeauto und einen einfachen Saisonansatz.</p><p><b>4. Saison:</b> Ein Klick simuliert alle zwölf Rennen des Kurzkalenders. Teamstärke, Fahrerqualität, Wetter und Zufall bestimmen Ergebnisse. Du siehst danach beide Meisterschaften, Einzelrennen und die Jahresabrechnung.</p><p><b>5. Weitermachen:</b> Mit der nächsten Saison sinkt die Vertragsrestlaufzeit um ein Jahr. Abgelaufene Fahrer können neu verpflichtet werden, solange sie nicht zurücktreten. Rivalen entwickeln sich und besetzen ihre freien Cockpits neu.</p><h3>Personal, Nachwuchs und Auto-Profil</h3><p>Unter <b>Zentrale → Personal & Akademie</b> kannst du drei Schlüsselrollen besetzen und ab Akademiestufe 1 bis zu drei Talente fördern. Gehälter und Förderung zählen zu den jährlichen Betriebskosten. Die Potenzialanzeige ist eine unsichere Einschätzung. Beförderung ab Alter 18, zwei Förderjahren und Stärke 70. Ausbildungsentschädigungen bleiben unter deinen bisherigen Ausgaben.</p><p>Unter <b>Zentrale & Forschung</b> legst du den Schwerpunkt künftiger Tempo-Pakete fest: Geraden, Kurven oder Reifenmanagement. Die Wirkung hängt von der Strecke ab. Gesamtstärke bleibt deine Orientierung.</p><h3>Drei Plätze pro Spielwelt</h3><p><b>Profil → Spielstände öffnen:</b> Wechseln, umbenennen, exportieren oder bestätigt löschen. Vor jedem Jahreswechsel entsteht eine zusätzliche Rückfallsicherung. Wiederherstellen bewahrt den neueren Stand als Rückweg. Browserdaten sind kein Cloud-Backup.</p><p>Zur Fahrerkarriere wechselst du unter <b>Profil</b>. Sie wird durch den Manager nicht verändert. Exportiere beide Spielwelten separat, bevor du eine neue HTML-Datei importierst. Lokaler Speicher ist je nach App nicht dauerhaft garantiert.</p><h3>Unabhängige Spielwelt</h3><p>Der Manager-Modus beginnt direkt in der Formel 1. Ein eigenes Team ergänzt das Feld auf zwölf Teams. Namen stammen aus derselben Datenbasis wie die Fahrerkarriere; sämtliche Ratings, Gehälter, Ablösen, Laufzeiten und Finanzwerte sind frei erfunden. Reale Markennamen stehen für simulierte Verträge, nicht für echte Partnerschaften oder Empfehlungen. Keine reale Wirtschafts- oder Regel-Simulation, keine Echtgeldkäufe und keine offiziellen Logos. Das Archiv behält die letzten 30 Saisons, die Karriere unterstützt bis zu 201 Saisons.</p>');}
const file=document.createElement('input');file.type='file';file.id='manager-import-file';file.accept='.json,application/json';file.hidden=true;document.body.append(file);
file.addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>16000000){toast('Der Manager-Spielstand darf maximal 16 MB groß sein.',true);return;}try{offerImport(await f.text());}catch(_){toast('Die Datei konnte nicht gelesen werden.',true);}});
document.addEventListener('change',e=>{if(!active)return;const id=e.target.id;
 if(id==='m-type'||e.target.name==='type')$('#m-creation-fields').innerHTML=creationFields(e.target.value==='custom');
 if(id==='m-team')$('#m-team-preview').innerHTML=teamPreview(e.target.value);
 if(id==='m-filter'){driverFilter=e.target.value;$('#m-market-list').innerHTML=marketList();}
 if(id==='m-slot'||id==='m-years'||id==='m-role')contractQuote(true);
 if(id==='m-reserve-years')reserveQuoteUpdate();
});
document.addEventListener('input',e=>{if(!active)return;if(e.target.id==='m-search'){search=e.target.value;$('#m-market-list').innerHTML=marketList();}if(e.target.id==='m-salary')contractQuote(false);});
document.addEventListener('submit',e=>{
 if(e.target.id==='manager-form'){e.preventDefault();try{const f=new FormData(e.target);const profile=f.get('type')==='custom'?{custom:true,name:f.get('name'),country:f.get('country'),color:f.get('color')}:{teamId:f.get('teamId')};profile.difficulty=f.get('difficulty')||'balanced';const seed=window.crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Date.now();S=M.createGame(profile,seed);view='overview';activate();save();render();window.scrollTo(0,0);}catch(err){$('#m-form-error').textContent=err.message;}}
 if(e.target.id==='m-contract-form'){e.preventDefault();const f=new FormData(e.target),bid={driverId:editDriver,slot:Number(f.get('slot')),years:Number(f.get('years')),salary:Math.round(Number(f.get('salary'))*1000000),role:f.get('role')||'equal'};if(mutate(()=>M.signDriver(S,bid),'drivers')){close();toast('Vertrag unterschrieben. Dein Team ist neu aufgestellt.');}}
 if(e.target.id==='m-reserve-form'){e.preventDefault();const f=new FormData(e.target),offer={driverId:editReserve,years:Number(f.get('years')),salary:Math.round(Number(f.get('salary'))*1000000)};if(mutate(()=>M.signReserve(S,offer),'drivers')){close();toast('Reservevertrag unterschrieben.');}}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='manager-open'){close();view='overview';render();window.scrollTo(0,0);return;}
 if(!a.startsWith('m-'))return;
 try{switch(a){
 case 'm-nav':view=v;render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'm-close':close();break;
 case 'm-help':help();break;
 case 'm-career':close();active=false;try{localStorage.setItem(ACTIVE,'career');}catch(_){}window.AufstiegUI.renderCareer();break;
 case 'm-offer':offerDialog(v);break;
 case 'm-reserve-offer':reserveOfferDialog(v);break;
 case 'm-release-reserve':{const r=M.managerReserve(S);if(!r)return;dialog('Reservevertrag auflösen?','<p>'+esc(r.name)+' hat noch '+r.remaining+' '+(r.remaining===1?'Saison':'Saisons')+' Vertrag.</p><p>Die Auflösungsentschädigung wird sofort aus deinem Teambudget bezahlt.</p>',btn('Abbrechen','close','','ghost')+btn('Vertrag auflösen','confirm-release-reserve'));break;}
 case 'm-confirm-release-reserve':if(mutate(()=>M.releaseReserve(S),'drivers')){close();toast('Reservevertrag aufgelöst.');}break;
 case 'm-sponsor-catalogue':sponsorCatalogueDialog();break;
 case 'm-sponsor':mutate(()=>M.signSponsor(S,v),'finance');break;
 case 'm-programme':mutate(()=>M.setProgramme(S,v),'development');break;
 case 'm-facility':{const o=M.facilityOffers(S).find(x=>x.id===v);if(!o?.available)return;dialog(o.name+' ausbauen?','<p>'+esc(o.text)+'</p>'+pair('Neue Stufe',o.level+1)+pair('Jetzt bezahlen',esc(compactMoney(o.cost)))+pair('Zusätzliche Wartung pro Jahr',esc(compactMoney(o.upkeep)))+'<p>Die Wartung fällt schon in dieser Saison und danach jedes Jahr an. Dein Budget muss sowohl Ausbau als auch laufende Kosten decken.</p>',btn('Abbrechen','close','','secondary')+btn('Ausbau bestätigen','confirm-facility',v));break;}
 case 'm-confirm-facility':if(mutate(()=>M.buyFacility(S,v),'development'))close();break;
 case 'm-research':{const o=M.researchOffer(S);if(!o.available)return;dialog('Forschung beauftragen?','<p>Das aktuelle Auto bleibt unverändert. Die Forschung hilft dem Auto der Saison '+(S.year+1)+'.</p>'+pair('Jetzt bezahlen',esc(compactMoney(o.cost)))+pair('Derzeit geschätzte Wirkung','ca. +'+o.gain.toLocaleString('de-AT')+' Teamstärke'),btn('Abbrechen','close','','secondary')+btn('Forschung bestätigen','confirm-research'));break;}
 case 'm-confirm-research':if(mutate(()=>M.buyResearch(S),'development'))close();break;
 case 'm-upgrade-reliability':mutate(()=>M.upgrade(S,'reliability'),'overview');break;
 case 'm-upgrade':mutate(()=>M.upgrade(S),'overview');break;
 case 'm-simulate':{const f=M.forecast(S);dialog('Saison '+S.year+' simulieren?','<p>Alle <b>12 Rennen</b> laufen automatisch. Du musst keine Rennentscheidungen treffen. Das Ergebnis wird sofort gespeichert.</p>'+pair('Dein Team',esc(M.displayTeamName(S)))+pair('Fahrer',M.roster(S).map(d=>esc(d.name)).join('<br>'))+pair('Hauptsponsor',esc(S.sponsor?.name||'Kein Sponsor'))+pair('Sicherer Mindest-Endstand',esc(compactMoney(f.endMinimum)))+'<p>Transfers und Entwicklung sind danach erst wieder in der Vorbereitung auf die nächste Saison möglich.</p>',btn('Zurück','close','','ghost')+btn('Saison starten '+icon('flag'),'confirm-simulate'));break;}
 case 'm-confirm-simulate':if(mutate(()=>{M.simulateSeason(S);view=S.phase==='summary'?'results':'overview';})){close();}break;
 case 'm-event-choice':if(mutate(()=>{M.chooseManagementEvent(S,v);M.simulateSeason(S);view=S.phase==='summary'?'results':'overview';})){toast('Entscheidung übernommen. Die Saison wurde fortgesetzt.');}break;
 case 'm-next':mutate(()=>M.advanceSeason(S),'overview');break;
 case 'm-export':exportSave();break;
 case 'm-import':file.click();break;
 case 'm-cancel-import':pendingImport=null;close();break;
 case 'm-accept-import':if(pendingImport){S=pendingImport;pendingImport=null;view=S.phase==='summary'?'results':'overview';save();close();render();window.scrollTo(0,0);toast('Manager-Spielstand geladen. Deine Fahrerkarriere bleibt erhalten.');}break;
 case 'm-new':E.slots('manager');break;
 case 'm-confirm-new':close();S=null;view='overview';V.remove('manager',V.active('manager'));render();window.scrollTo(0,0);break;
 case 'm-race':{const report=b.dataset.report&&b.dataset.report!=='latest'?S.archive[Number(b.dataset.report)]:S.lastSeason,r=report?.results[Number(v)];if(!r)return;dialog(r.track+' · '+report.year,'<p>'+esc(r.circuit)+' · '+(r.wet?'Regen':'Trocken')+'</p><div class="table-wrap"><table><thead><tr><th>Platz</th><th>Fahrer</th><th>Team</th><th>Start</th><th>Punkte</th></tr></thead><tbody>'+r.rows.map(d=>'<tr class="'+(d.teamId===report.teamId?'you':'')+'"><td>'+(d.dnf?'DNF':d.position)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.teamName)+'</td><td>P'+d.grid+'</td><td>'+d.points+'</td></tr>').join('')+'</tbody></table></div>');break;}
 case 'm-archive':{selectedArchive=Number(v);const report=S.archive[selectedArchive];if(!report)return;$('#app').innerHTML=shell(pageHeading('ARCHIV / '+report.year,'Deine Saison '+report.year,report.teamName)+btn(icon('back')+' Zurück zum Archiv','nav','archive','ghost mb16')+reportBody(report,true));window.scrollTo(0,0);break;}
 case 'm-report-finance':{const report=v==='latest'?S.lastSeason:S.archive[Number(v)];if(report)dialog('Saisonfinanzen '+report.year,financeBreakdown(report));break;}
 }}catch(err){toast(err.message||'Diese Aktion ist nicht möglich.',true);}
});
window.AufstiegManagerUI={getState:()=>S?JSON.parse(M.serialize(S)).state:null,isActive:()=>active,saveKey:V.key,deactivate:()=>{active=false;},apply:(fn,nextView)=>mutate(()=>fn(S),nextView),loadSlot:raw=>{S=raw?M.deserialize(raw):null;view=S?.phase==='summary'?'results':'overview';render();window.scrollTo(0,0);},offerImport};
try{if(localStorage.getItem(ACTIVE)==='manager')render();}catch(_){}
if(bootError)toast(bootError,true);
})();
</script>
</body></html>
