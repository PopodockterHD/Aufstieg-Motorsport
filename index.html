(function(){
  'use strict';
  try{
    const ls=window.localStorage;
    const marker='aufstieg_reset_v0331';
    if(ls.getItem(marker)!=='1'){
      for(const key of ['aufstieg_v07_slots','aufstieg_v01_save','aufstieg_manager_v1_save','aufstieg_active_mode']){
        try{ls.removeItem(key);}catch(_){}
      }
      ls.setItem(marker,'1');
    }
  }catch(_){}
})();

</script><script>/* WTV selection, source preview and in-game context. Uses existing layout classes.

(function(){

function ratingExplanation(){return p('Renntempo basiert vor allem auf der durchschnittlichen Rennplatzierung. Qualifying verwendet den Mittelwert, sonst vorsichtig Best-/Worst-Platz. Wenige nachgewiesene Ergebnisse werden stärker an die Ligabasis angenähert. TOP10 ist nur eine Untergrenze, <b>keine erfundene Zahl der Starts</b>. Punkte werden nicht nochmals auf die Stärke aufgeschlagen.')+p('Zweikampf, Konstanz, Reifenmanagement, Technik und Fitness sind neutrale Spielgrundwerte je Liga – diese Eigenschaften sind aus den Fotos nicht messbar. DNFs bedeuten nicht automatisch Fahrfehler. Liga 1 ist im Mittel stärker, die Spielwertbereiche überschneiden sich.');}
function remember(){const f=$('#wtv-form');if(!f||!draft)return;const x=Object.fromEntries(new FormData(f));for(const [key,value] of Object.entries(x))draft[key.replace(/^w-/,'')]=value;}
function setup(kind='career'){

function drawSetup(){

 if(!c.drivers.some(d=>d.id===draft.driver))draft.driver=c.drivers[0].id;
 if(!c.teams.some(t=>t.id===draft.team))draft.team=c.teams[0].id;
 const existing=draft.entry==='existing';

 body+='<form id="wtv-form">'+select('w-kind','Was möchtest du spielen?',[['career','WTV-Fahrerkarriere'],['manager','WTV-Managerkarriere']],kind)+select('w-league','Deine Liga',T.LEAGUES.map(l=>[l.id,l.name]),draft.league)+select('w-entry','Dein Einstieg',kind==='career'?[['existing','Vorhandenen WTV-Fahrer übernehmen'],['new','Eigenen Fahrer erstellen']]:[['existing','Vorhandenes WTV-Team übernehmen'],['new','Eigenes WTV-Team gründen']],draft.entry);

  body+=input('w-number','Deine Spiel-Startnummer (1–99)',draft.number,'type="number" min="1" max="99" required inputmode="numeric"')+p('Die echten Startnummern fehlen in den Tabellen. Diese Nummer ist frei gewählt, keine bestätigte WTV-Startnummer. Alle Figuren starten mit dem fiktiven Spielalter 20.')+select('w-mode','Spielweise',[['quick','Schnell – kompakte Karriere (empfohlen)'],['career','Karriere-Fokus – einzelne Wochenenden'],['standard','Standard – ausführliche Karriere']],draft.mode);
 }else{
  if(existing){const world=T.initialWorld(l.id),t=world.teams.find(t=>t.id===draft.team);body+=select('w-team','WTV-Team übernehmen',c.teams.map(t=>[t.id,t.name]),draft.team)+panel(esc(t.name),t.drivers.map((d,i)=>pair('Cockpit '+(i+1),esc(d.name))).join('')+p('Auto-Stärke 76 / 99 · 40 Mio. € Startbudget. Fehlende Stammfahrer sind ausdrücklich fiktive Ersatzfahrer. WTV-Reservefahrer findest du im Fahrermarkt.'));}
  else body+=input('w-name','Dein Teamname',draft.name,'minlength="2" maxlength="40" required autocomplete="off"')+select('w-country','Teamland',D.countries,draft.country)+select('w-color','Teamfarbe',[['#6b9cf7','Blau'],['#ffa85c','Orange'],['#b8ed62','Grün'],['#ff6464','Rot'],['#d9e4eb','Silber']],draft.color)+p('Du ergänzt deine Liga als zwölftes Team mit zwei fiktiven Nachwuchsfahrern. 30 Mio. € Startbudget, Auto-Stärke 64. Keine vorhandenen WTV-Fahrer werden dir automatisch zugeordnet.');
  body+=p('Die 11 vorhandenen Teams beginnen mit gleicher Autostärke und neutralem Streckenprofil. Eure Team-WM-Punkte werden nicht als zusätzlicher Autobonus gewertet. Ab dann entwickeln sich alle Teams im Spiel weiter.');
 }
 body+=select('w-difficulty','Schwierigkeit (unabhängig von der Spielweise)',G.difficultyOptions().map(d=>[d.id,d.name]),draft.difficulty);

function catalogue(id){previewLeague=id;const c=T.catalogue(id);let body='<div class="row wrap">'+T.LEAGUES.map(l=>button(esc(l.name),'catalogue',l.id,'secondary')).join('')+'</div>'+dataNotice()+ratingExplanation();

 body+='<details class="mt16"><summary>Team-WM aus dem Quellenbild</summary><div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Team</th><th>Quellenpunkte</th></tr></thead><tbody>'+c.teams.map(t=>'<tr><td>'+t.rank+'</td><td>'+esc(t.name)+'</td><td>'+t.points+'</td></tr>').join('')+'</tbody></table></div>'+p('Die Team-Punkte müssen nicht der Summe der hier abgebildeten aktuellen Stammfahrer entsprechen. Keine nachträglichen Zuordnungen aus Differenzbeträgen.')+'</details><div class="row wrap mt16">'+(draft?button('Zurück zur Auswahl','back','','secondary'):'')+button('Schließen','close','','ghost')+'</div>';

function decorate(kind,s,view){

 if(s.wtv){const l=T.league(s.wtv.league);const bar=host.querySelector('.release-bar');const html='<div class="row between wrap mt16 mb16" data-wtv-context>'+tag(l)+'<span class="muted" style="font-size:11px">Eigene Simulation · 12 Spielrennen</span>'+button('WTV-Daten','catalogue',l.id,'ghost small')+'</div>';if(bar)bar.insertAdjacentHTML('afterend',html);else host.insertAdjacentHTML('afterbegin',html);}
 if(view==='profile'||view==='settings'){

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!b.dataset.action.startsWith('w-'))return;

});
document.addEventListener('change',e=>{if(!e.target.closest('#wtv-form'))return;const oldKind=draft?.kind;remember();if(draft&&draft.kind!==oldKind)draft.slot=null;if(['w-kind','w-league','w-entry','w-driver','w-team','w-style'].includes(e.target.id))drawSetup();});

  const seed=window.crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Date.now();
  const profile={wtvLeague:draft.league,difficulty:draft.difficulty};let s,engine,ui;

  else{if(draft.entry==='existing')profile.teamId=draft.team;else Object.assign(profile,{custom:true,name:draft.name,country:draft.country,color:draft.color});engine=M;ui=window.AufstiegManagerUI;}
  s=engine.createGame(profile,seed);engine.validate(s);const raw=engine.serialize(s),oldIndex=V.active(kind);let persisted;
  try{V.switchSlot(kind,index);persisted=V.save(kind,raw);}catch(err){try{V.switchSlot(kind,oldIndex);}catch(_){}throw err;}

(function(){

applyTheme();
const changes=p('<b>Neu in 0.42.2 – Reserveplätze sind keine Garantie:</b> F1-Topteams entscheiden nun unabhängig voneinander, ob sie nach deiner F2-Saison Reserveinteresse zeigen. Die Chance steigt durch WM-Platzierung, Siege/Podien, Gesamtstärke und Bewährung/Ruf, kann aber auch bei einer sehr starken Saison bei allen Teams scheitern. Es gibt keinen automatischen Ersatz-Reserveplatz mehr.')+p('<b>Hotfix 0.42.1 – Topteam-Regel gilt jetzt in allen Fahrer-Modi:</b> Standard- und Karriere-Fokus-Spielstände umgehen die Topteam-Sperre nicht mehr. Direkt nach der F2 reicht GES allein bei der aktuellen Topgruppe nicht; ein seltenes direktes Angebot wird ausdrücklich als TEAMKONTAKT markiert. Der F3→F1-Sonderweg ist im normalen Markt ebenfalls nur noch über einen sichtbaren direkten Teamkontakt möglich. Bei älteren Nicht-Schnell-Spielständen kann ein angezeigtes Reserveinteresse bewusst in den kompakten Reserveweg wechseln.')+p('<b>Weiterhin aus 0.42 – Topteam-Cockpits müssen verdient werden:</b> Bei den aktuell besten F1-Teams reicht die Gesamtstärke allein nicht mehr für einen direkten Vertrag. Direkt aus der F2 brauchst du eine außergewöhnliche Saison plus konkretes Teaminteresse; meistens führt der realistischere Weg über ein Mittelfeldteam oder einen Reservevertrag. Ein starkes Reserveprogramm bleibt ein echter Türöffner und kann die normale Stärkehürde ersetzen. Welche Teams als Topteams gelten, wird dynamisch aus der aktuellen Spielwelt berechnet – nicht aus dem Namen.')+p('<b>Weiterhin aus 0.41 – dynamische F1-Cockpit-Hürden:</b> Stammcockpit-Anforderungen steigen jetzt stufenlos mit der aktuellen Teamstärke statt ab einer Grenze fast überall gleich zu sein. Ein 80er-Team verlangt deutlich weniger als ein 86er- oder 92er-Team. Historisch große Teams wie Ferrari, McLaren, Mercedes und Red Bull erhalten nur noch einen kleinen Prestige-Aufschlag, solange sie sportlich konkurrenzfähig sind. Fällt ein Prestige-Team ins Mittelfeld oder Hinterfeld, wird auch der direkte Einstieg entsprechend leichter. Aktuell wirklich starke Teams können weiterhin strengere Leistungsnachweise verlangen und einen Reserveweg anbieten.')+p('<b>Weiterhin aus 0.40 – moderner Karrierestart & Reserveweg:</b> Fahrer- und Managerkarriere besitzen einen großen zentrierten Setup-Screen. Nach F2 können aktuell starke Topteams oder noch konkurrenzfähige Prestige-Teams einen Reserveweg anbieten; starke Reserveeinsätze können später die normale Einstiegsschwelle ersetzen.')+p('<b>Weiterhin aus 0.38 – News nach dem Karriereende:</b> Die Abschlussseite zeigt jetzt die wichtigsten Meldungen der letzten aktiven Saison direkt noch einmal an. Von dort kannst du die vollständige Karrierewelt mit allen News, Rekorden, Rivalitäten und Gerüchten öffnen. Das eigene Karriereende wird als besondere News mit Fahrername, Alter, Team und gespeicherter Bilanz festgehalten.')+p('<b>Weiterhin aus 0.37.1 – Karriereabschluss wiederhergestellt:</b> Die versehentlich fehlende Abschlussseite ist wieder vorhanden. Nach dem letzten aktiven Jahr werden Karrieretitel, F1-Saisons, Siege, Podien und Meistertitel wieder korrekt angezeigt.')+p('<b>Neu in 0.37 – glaubwürdigere Spätkarriere:</b> Ab etwa 38 bis 40 wird die Alterskurve spürbarer. Pace, Qualifying und Fitness bauen im hohen Alter stärker ab, während Rennintelligenz, Technik, Konstanz und Reifenmanagement länger erhalten bleiben. Training und positive Entwicklung werden ab 38 schrittweise weniger wirksam – auch beim Spaß-Fahrstil Wunderkind. Eine außergewöhnliche Karriere kann mit 42 noch sehr stark sein, GES 95 soll dort aber nur noch ein seltener Übergangszustand sein. Die aktive Fahrerkarriere endet nun nach der Saison im Alter 44; bestehende Titel und Statistiken werden nicht rückwirkend verändert.')+p('<b>Weiterhin aus 0.36 – feste News-Hierarchie, echte Gerüchte & Rekordserien:</b> Fahrer- und Konstrukteurs-Weltmeister stehen im Top-Bereich immer vor allen anderen Meldungen. Danach folgen WM-Finale, Titel-Drama und große Rekorde, anschließend Gerüchte/Silly Season; gewöhnliche Verträge, Verlängerungen, Reaktionen und normale Interviews rutschen bewusst weiter nach unten. Gerüchte über den Spieler beeinflussen nun tatsächlich die Chance auf ein Vertragsangebot des genannten F1-Teams und werden später als bestätigt oder falsch aufgelöst. Das Rekordbuch verfolgt zusätzlich Siegesserien, Podiums-/Punkte-/Pole-Serien, Pole-Rekorde, WM-Abstände, Titel-Comebacks und weitere historische Bestwerte.')+p('<b>Weiterhin aus 0.35 – WM-Finale, Titelkampf-Drama & News-Prioritäten:</b> Vor dem letzten F1-Rennen erzeugt das Spiel bei einer offenen Fahrer- oder Konstrukteurs-WM eine große Vorschau mit realen Punkteständen und den mathematisch verbliebenen Kandidaten. Nach dem Finale kann eine eigene Meldung den knapp verlorenen Titelkampf erzählen – inklusive DNF, schlechtem Ergebnis, engem Punkteabstand, Comeback oder früherer WM-Führung. Die Konstrukteurs-WM erhält dieselbe Vorher-/Nachher-Logik.')+p('<b>Weiterhin aus 0.34 – seltener Direktaufstieg F3 → F1:</b> Nach einer außergewöhnlichen Formel-3-Saison kann ein sehr starkes Nachwuchstalent die Formel 2 überspringen und direkt ein F1-Stammcockpit angeboten bekommen. Dafür zählen Meisterschaftsergebnis, sichtbare Entwicklung, Ruf, sportlicher Nachweis und das intern simulierte Talentprofil. Der Weg bleibt selten; normale gute F3-Saisons führen weiterhin in die Formel 2. Topteams greifen nur bei echten Ausnahmetalenten zu. Ein solcher Vertrag wird als Breaking News erzählt.')+p('<b>Weiterhin aus 0.33.1 – sauberer Browserstart:</b> Ein alter oder inkompatibler lokaler Aufstieg-Spielstand kann die Website nicht mehr blockieren. Beim ersten Start dieser Version werden nur frühere Aufstieg-Spielstände und der alte Modusstatus verworfen; das gewählte Design bleibt erhalten.')+p('<b>Weiterhin aus 0.33 – lebendiges Fahrerlager:</b> Fortlaufende Storylines verbinden frühere DNFs, Siege und Konflikte mit späteren Meldungen. Seltene Pressekonferenzen mit mehreren Fahrern, unterschiedliche KI-Medienpersönlichkeiten, echte oder falsche Silly-Season-Gerüchte, Reaktionen auf Transfers, Teamkonflikte mit Antwortmöglichkeiten, automatische Saison-Narrative, historische Vergleiche, Karriere-Meilensteine, angekündigte Abschiedswochenenden, Renningenieur-/Teamchef-Reaktionen und seltene Breaking-News sind neu. Die Systeme greifen ineinander, statt nur einzelne Zufallsmeldungen zu erzeugen.')+p('<b>Weiterhin aus 0.32.1 – erster F1-Sieg zählt karriereweit:</b> Der erste Sieg einer neuen Saison wird nicht mehr fälschlich als erster Formel-1-Sieg der Karriere behandelt. Dasselbe Schutzprinzip gilt für die Interview-Meilensteinlogik; DNF-Interviews bleiben unverändert möglich und erscheinen nach einer Antwort in den News.')+p('<b>Weiterhin aus 0.32 – farbcodierte News:</b> News-Karten tragen jetzt je nach Ereignis einen dezenten Farbakzent und ein eindeutiges Kategorie-Badge. Positive Vertrags- und Erfolgsnews sind grün, Trennungen und Ausfälle rot, Sport/Presse blau, Teamwechsel orange, besondere Meilensteine violett und der F1-Weltmeister exklusiv gold. Die Farbe ist nur Zusatzinformation; Text und Symbol bleiben immer sichtbar.')+p('<b>Weiterhin aus 0.31 – Interviews seltener & stärkere F1-Generationen:</b> Normale Podiums-Interviews sind jetzt deutlich seltener. Nach einem eigenen Interview folgen mindestens zwei Rennen ohne neues Pflichtinterview; nur besondere Meilensteine wie erster Sieg, erstes Podium oder ein WM-Titel dürfen die Pause umgehen. Auch KI-Interviews wurden ausgedünnt. Gleichzeitig entwickeln sich über lange Karrieren häufiger echte Elite-Rivalen, Topfahrer halten ihr Niveau etwas länger und F1-Teams durchlaufen stärkere mehrjährige Auf- und Abschwünge, damit dominante Epochen nicht automatisch ewig gleich bleiben.')+p('<b>Hotfix 0.30.1:</b> Rennwochenenden und das Saisonfinale sind wieder korrekt erreichbar. Die versehentlich fehlenden Seitenfunktionen wurden wiederhergestellt; Spielstände und die neuen News aus 0.30 bleiben unverändert.')+p('<b>Neu in 0.30 – kurze Meldung oder kleiner Artikel:</b> News haben jetzt unterschiedliche Tiefe. Gewöhnliche Meldungen können knapp bleiben, während Weltmeisterschaften, wichtige DNFs, erste Siege, Rookie-Durchbrüche, Interviews und ausgewählte Vertragsentscheidungen situationsabhängig deutlich ausführlicher erzählt werden. Längere Texte verwenden nur Informationen aus der simulierten Karrierewelt.')+p('<b>Weiterhin aus 0.29 – dynamische Fahrer-Interviews:</b> Nach passenden Rennsituationen kann eine Pressefrage entstehen. Beim eigenen Fahrer wählst du eine von drei Antworten; sie beeinflusst leicht Bekanntheit oder Teamvertrauen und erscheint anschließend als <b>Fahrer-Interview · Spiel</b> in den News. Auch KI-Fahrer können Interviews zu Siegen, verlorenen Chancen, DNFs, Podien, Rookie-Auftritten und Titelkämpfen geben.')+p('<b>Weiterhin aus 0.28 – lebendigere Fahrerlager-News:</b> Vertragsverlängerungen, Verpflichtungen, Beförderungen und Trennungen variieren ihre Formulierungen. Besondere F1-Rennereignisse können zusätzliche Schlagzeilen erzeugen.')+p('<b>Weiterhin aus 0.27 – News sofort sichtbar:</b> In der Fahrerkarriere gibt es oben dauerhaft den Button <b>News</b>. Er öffnet die Karrierewelt direkt; im normalen Archiv steht der Einstieg vor der Saisonliste.')+p('<b>Weiterhin aus 0.26 – Teamdynamik & Weltmeister-Rolle:</b> Teamvertrauen, Teamkollegenbeziehung und Renningenieur-Chemie können sich schneller und sichtbarer entwickeln – positiv wie negativ. Ein amtierender F1-Weltmeister mit gewonnenem Teamkollegen-Duell wird bei genügend Vertrauen sehr wahrscheinlich zum Führungsfahrer; auch neue Vertragsangebote berücksichtigen den Titel stärker.')+p('<b>News ohne versteckte Werte:</b> Interviews und Meldungen entstehen nur aus tatsächlich simulierten Vorgängen. Potenzial, Prime und andere interne Werte werden nicht als News verraten. Zitate sind ausdrücklich fiktive In-Game-Statements.')+p('<b>Manager:</b> 0.42.2 ändert nur Fahrer-Angebotslogik und Startdarstellung; die Manager-Mechaniken bleiben unverändert.');
function releaseBar(start){return '<section class="release-bar"><div class="row between wrap"><span class="eyebrow">AUFSTIEG · VERSION 0.42.2</span>'+button(theme==='dark'?'☀ Helles Design':'☾ Dunkles Design','theme')+'</div>'+(start?'<details class="mt8"><summary>Was ist neu?</summary>'+changes+'</details>':'')+'</section>';}
function difficultyField(kind){return '<div class="field release-difficulty"><label for="'+kind+'-difficulty">Schwierigkeit</label><select id="'+kind+'-difficulty" name="difficulty">'+C.DIFFICULTIES.map(x=>'<option value="'+x.id+'" '+(x.id==='balanced'?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><small class="muted" id="'+kind+'-difficulty-note">'+esc(C.DIFFICULTIES[1].description)+'</small><small class="faint" style="display:block;margin-top:6px">Unabhängig von der Klickhäufigkeit. Keine versteckten Zusatzdefekte.</small></div>';}
function difficultyPanel(s,kind){const d=C.difficulty(s),can=C.canSetDifficulty(s);return panel('Schwierigkeit',pair('Aktuell',esc(d.name))+p(esc(d.description))+'<div class="row wrap mt16">'+C.DIFFICULTIES.map(x=>button(esc(x.name),'difficulty',kind+':'+x.id,!can||d.id===x.id)).join('')+'</div>'+p(can?'Die Änderung wirkt auf künftige Entscheidungen, nicht rückwirkend auf dein Geld oder bereits erreichte Werte.':kind==='manager'?'Änderbar in der Saisonvorbereitung vor Sponsorwahl und Ausgaben.':'Änderbar zwischen den Saisons vor der nächsten Teamwahl.')+p('Wunderkind bleibt ein eigener Spaß-Fahrstil. Rennform und technische Ausfälle sind bei jeder Schwierigkeit nach denselben Regeln berechnet.'));}
function sponsorPanel(s,compact=false){const o=G.driverLife(s).sponsor,active=o?.year===s.year;
 if(compact)return panel('Dein persönlicher Sponsor',active?'<h3>'+esc(o.name)+'</h3>'+p('Garantiert bereits erhalten: '+esc(euro(o.guaranteed))+'. Bonus: '+esc(G.personalSponsorGoal(o))+'.')+button('Vertrag & Rivalitäten ansehen','life'):p('Eine freiwillige Wahl für die Saison. Ein persönlicher Sponsor unterstützt dich zusätzlich zur Akademie, ohne weitere Rennentscheidungen.')+button('Sponsorangebote & Rivalitäten','life'));
 const last=G.driverLife(s).lastSponsor;
 let content=p('Ein persönlicher Vertrag pro Saison. Die Garantie wird bei der Unterschrift ausgezahlt, der Erfolgsbonus einmal beim Jahreswechsel. Nur nach Teamwahl und vor dem ersten Training wählbar.')+p('<b>Reine Spielsimulation:</b> Reale Markennamen, aber frei erfundene Verträge und Beträge. Keine Kooperation, Empfehlung oder echte Geldzahlung.');
 if(active)content+='<h3 class="mt16">'+esc(o.name)+'</h3>'+pair('Garantiert bereits erhalten',esc(euro(o.guaranteed)))+pair('Möglicher Saisonbonus',esc(euro(o.bonus)))+pair('Bonusziel',esc(G.personalSponsorGoal(o)))+pair('Status',o.settled?'Saison abgerechnet':'Vertrag läuft');
 else content+='<div class="offer-grid mt16">'+G.personalSponsorOffers(s).map(o=>'<article class="panel"><h3>'+esc(o.name)+'</h3>'+p(esc(o.description))+pair('Garantie bei Unterschrift',esc(euro(o.guaranteed)))+pair('Bonus zum Saisonende',esc(euro(o.bonus)))+pair('Bonusziel',esc(G.personalSponsorGoal(o)))+'<div class="mt16">'+button('Sponsor auswählen','personal-sponsor',o.id,!o.available)+'</div></article>').join('')+'</div>';
 if(last)content+='<details class="mt16"><summary>Letzte Sponsorabrechnung · '+last.year+'</summary>'+pair(esc(last.name),esc(euro(last.guaranteed+last.bonus)))+p(last.achieved?'Bonusziel erreicht.':'Keine Erfolgsprämie; die Garantie bleibt erhalten.')+'</details>';
 return panel('Persönliche Sponsoren',content);
}
function rivalsPanel(s){const rivals=G.rivalries(s);return panel('Deine sportlichen Rivalitäten',p('Die Begegnungen entstehen aus gemeinsamen Rennen. Sie bleiben nach Teamwechseln erhalten und geben weder Tempo-Boni noch Nachteile. Direkte Rennduelle zählen nur, wenn beide ins Ziel kommen.')+(rivals.length?'<div class="grid2 mt16">'+rivals.map(r=>'<article class="panel"><h3>'+esc(r.name)+'</h3>'+p(esc(r.teamName)+(r.stage?' · '+esc(s.wtv?G.competitionName(s):G.D.stages[r.stage].name):''))+pair('Gemeinsame Geschichte',r.firstYear+'–'+r.lastYear)+pair('Enge Zielankünfte',r.closeRaces)+pair('Direkte Rennduelle',r.wins+' : '+r.losses)+pair('Qualifying-Duelle',r.qualiWins+' : '+r.qualiLosses)+pair('Enge Top-3-Saisonduelle',r.titleDuels)+p(r.active?'Aktuell in deinem Startfeld.':'Aktuell nicht in deinem Feld. Eure Geschichte bleibt bestehen.')+'</article>').join('')+'</div>':p('Noch keine Rivalität entstanden. Fahre einige Rennen; regelmäßig enge sportliche Begegnungen werden hier sichtbar.')));}
function sillySeasonPanel(s){
 const items=G.worldNews?.(s)||[];
 let body=p('Die Meldungen entstehen aus den tatsächlichen Transfers, Verträgen und besonderen F1-Rennereignissen deiner Spielwelt. Die wichtigsten Geschichten werden bewusst angeheftet: Fahrer- und Konstrukteurs-Weltmeister zuerst, danach WM-Finale, Titel-Drama und große Rekorde, anschließend Gerüchte/Silly Season. Normale Verträge, Reaktionen und Interviews stehen weiter unten. Innerhalb derselben Wichtigkeitsstufe steht die neueste Nachricht oben. Farben dienen nur als schneller Akzent; Kategorie-Badges benennen jede Meldung zusätzlich.');
 if(!items.length)return panel('Fahrerlager-News & Silly Season',body+p('Noch keine gespeicherten Meldungen. Transfers entstehen beim nächsten F1-Jahreswechsel; besondere Rennen, Interviews, Rookie-Auftritte, wichtige DNFs und der Weltmeister können schon während der Saison Schlagzeilen erzeugen.'));
 const visual=n=>{
  switch(n.category){
   case 'championship':return {label:'WELTMEISTER',icon:'🏆',tone:'news-champion'};
   case 'constructors':return {label:'TEAM-WELTMEISTER',icon:'🏆',tone:'news-champion'};
   case 'title-finale':return {label:'WM-FINALE',icon:'🏁',tone:'news-special'};
   case 'title-loss':return {label:'TITELDRAMA',icon:'◆',tone:'news-negative'};
   case 'renewal':return {label:'VERLÄNGERUNG',icon:'✓',tone:'news-positive'};
   case 'promotion':return {label:'BEFÖRDERUNG',icon:'↑',tone:'news-positive'};
   case 'signing':return {label:'NEUVERPFLICHTUNG',icon:'✓',tone:'news-positive'};
   case 'win':return {label:'SIEG',icon:'◆',tone:'news-positive'};
   case 'podium':return {label:'PODIUM',icon:'▲',tone:'news-positive'};
   case 'release':return {label:'TRENNUNG',icon:'!',tone:'news-negative'};
   case 'dnf':return {label:'AUSFALL',icon:'×',tone:'news-negative'};
   case 'interview':return {label:'INTERVIEW',icon:'◉',tone:'news-info'};
   case 'race':return {label:'RENNBERICHT',icon:'●',tone:'news-info'};
   case 'rookie':return {label:'ROOKIE',icon:'★',tone:'news-info'};
   case 'team-change':return {label:'TEAMWECHSEL',icon:'↔',tone:'news-transfer'};
   case 'retirement':return {label:'RÜCKTRITT',icon:'◆',tone:'news-special'};
   case 'milestone':return {label:'MEILENSTEIN',icon:'★',tone:'news-special'};
   case 'press':return {label:'PRESSEKONFERENZ',icon:'◉',tone:'news-info'};
   case 'rumour':return {label:'GERÜCHT',icon:'?',tone:'news-rumour'};
   case 'reaction':return {label:'REAKTION',icon:'↪',tone:'news-info'};
   case 'record':return {label:'REKORD',icon:'◆',tone:'news-special'};
   case 'farewell':return {label:'ABSCHIED',icon:'◇',tone:'news-special'};
   case 'conflict':return {label:'TEAMKONFLIKT',icon:'!',tone:'news-conflict'};
   default:return {label:'TRANSFER',icon:'↔',tone:'news-transfer'};
  }
 };
 body+='<div class="news-legend mt16" aria-label="Farblegende der News"><span class="badge news-key-positive">✓ POSITIV</span><span class="badge news-key-negative">! NEGATIV</span><span class="badge news-key-info">● SPORT / PRESSE</span><span class="badge news-key-transfer">↔ WECHSEL</span><span class="badge news-key-special">★ BESONDERS</span><span class="badge news-key-champion">🏆 WELTMEISTER</span></div>';
 const renderCards=list=>list.map(n=>{
  const v=visual(n);
  const statement=n.quote?'<div class="notice info mt16"><div><b>'+esc(n.quoteLabel||'Teamchef-Statement · Spiel')+'</b><br>'+esc(n.quote)+'</div></div>':'';
  const second=n.secondaryQuote?'<div class="notice info news-secondary-quote"><div><b>'+esc(n.secondaryQuoteLabel||'Reaktion · Spiel')+'</b><br>'+esc(n.secondaryQuote)+'</div></div>':'';
  const story=String(n.body||'').split(/\n{2,}/).filter(Boolean).map(x=>p(esc(x))).join('');
  const related=n.related?'<div class="news-related">↳ '+esc(n.related)+'</div>':'';
  const round=Number.isInteger(n.round)?' · Rennen '+(n.round+1):'',importance=n.importance==='breaking'?' news-breaking':n.importance==='major'?' news-major':'';
  return '<article class="panel news-card '+v.tone+importance+'" data-news-category="'+esc(n.category||'team-change')+'"><div class="row between wrap"><span class="eyebrow">'+(n.importance==='breaking'?'BREAKING NEWS · ':'')+esc(n.year)+round+' · '+esc(n.teamName)+'</span><span class="badge news-badge">'+v.icon+' '+esc(v.label)+'</span></div><h3 class="mt8">'+esc(n.title)+'</h3>'+story+statement+second+related+'</article>';
 }).join('');
 const priority=n=>L.newsPriority?.(n)||0,titleYears=items.filter(n=>['championship','constructors','title-loss','title-finale'].includes(n.category)).map(n=>n.year),latestTitleYear=titleYears.length?Math.max(...titleYears):null;
 const top=items.filter(n=>(n.year===s.year&&priority(n)>=900)||(latestTitleYear!==null&&n.year===latestTitleYear&&priority(n)>=1000)||(n.category==='rumour'&&n.year>=s.year-1)).sort((a,b)=>priority(b)-priority(a)||b.year-a.year||((b.round??-1)-(a.round??-1))).slice(0,12),topIds=new Set(top.map(n=>n.id));
 const rest=items.filter(n=>!topIds.has(n.id)).sort((a,b)=>b.year-a.year||((b.round??-1)-(a.round??-1))||priority(b)-priority(a)).slice(0,Math.max(0,60-top.length));
 if(top.length)body+='<div class="row between wrap mt16"><div class="eyebrow accent">TOP-MELDUNGEN</div><span class="badge dim">WICHTIGES ZUERST</span></div><div class="stack mt16">'+renderCards(top)+'</div>';
 if(rest.length)body+='<div class="eyebrow mt24">WEITERE NEWS</div><div class="stack mt16">'+renderCards(rest)+'</div>';
 return panel('Fahrerlager-News & Silly Season',body);
}
function storylinesPanel(s){
 const data=window.AufstiegDriverLife?.storylines?.(s);if(!data)return '';
 const cards=[];for(const n of data.narratives||[])cards.push('<article class="storyline-card"><div class="eyebrow"><span class="storyline-dot"></span>SAISON-NARRATIV</div><h4>'+esc(n.label)+'</h4><p>'+esc(n.text)+'</p></article>');for(const r of data.rumours||[])cards.push('<article class="storyline-card"><div class="eyebrow">? OFFENES GERÜCHT</div><h4>'+esc(r.driverName)+' → '+esc(r.targetTeam)+'</h4><p>Noch nicht bestätigt. Das Gerücht kann sich im weiteren Verlauf bestätigen oder als falsch herausstellen.</p></article>');if(!cards.length)return panel('Laufende Geschichten',p('Aktuell gibt es keine größere fortlaufende Storyline. Neue Geschichten entstehen aus Rennen, Rivalitäten, Verträgen und dem Fahrermarkt.'));return panel('Laufende Geschichten',p('Die Karrierewelt erinnert sich an frühere Ereignisse. Saisontrends und offene Gerüchte können später in neue Meldungen zurückkehren.')+'<div class="storyline-grid mt16">'+cards.slice(0,6).join('')+'</div>');
}
function timelinePanel(s){
 const rows=G.careerTimeline?.(s)||[];
 let body=p('Deine abgeschlossenen Saisons und wichtigen Meilensteine in einer Karrieregeschichte. Alte Spielstände werden aus dem vorhandenen Saisonarchiv rekonstruiert.');
 if(!rows.length)return panel('Karriere-Zeitleiste',body+p('Nach deiner ersten abgeschlossenen Saison entsteht hier die Zeitleiste.'));
 body+='<div class="stack mt16">'+rows.map(x=>{
  const result=x.position?'P'+x.position:'LIVE';
  const season=x.position?pair('Saison',x.points+' Punkte · '+x.wins+' Siege · '+x.podiums+' Podien'):'';
  const rating=x.rating?pair('Stärke am Saisonende',x.rating+' / 99'):'';
  const marks=x.milestones?.length?'<div class="row wrap mt16">'+x.milestones.map(m=>'<span class="badge dim">'+esc(m)+'</span>').join('')+'</div>':'';
  return '<article class="panel"><div class="row between wrap"><div><div class="eyebrow">'+esc(x.year)+' · '+esc(x.stageName)+'</div><h3 class="mt8">'+esc(x.teamName)+'</h3></div><div class="archive-result '+(x.position===1?'accent':'')+'">'+result+'</div></div>'+season+rating+marks+'</article>';
 }).join('')+'</div>';
 return panel('Karriere-Zeitleiste',body);
}
function recordBookPanel(s){
 const r=G.careerRecordBook?.(s);if(!r)return panel('Rekordbuch',p('Noch keine Rekorddaten verfügbar.'));
 const me=r.player,f=r.f1;

const skillFmt=n=>Number(n).toLocaleString('de-AT',{maximumFractionDigits:2});
function styleOptions(selected='balanced'){
 return D.drivingStyles.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+esc(x.name+(x.fun?' (Spaß-Stil)':''))+'</option>').join('');
}
function styleDescription(style){
 return '<p class="mt8"><b>'+(style.fun?'Spaß-Stil':'Stärken')+':</b> '+esc(style.strengths)+'</p>'+
 '<p class="mt8"><b>'+(style.fun?'Hinweis':'Schwächen')+':</b> '+esc(style.weaknesses)+'</p>'+
 '<p class="mt8"><b>Entwicklung:</b> '+esc(style.learning)+'</p>';
}
function styleValues(values,label){
 return '<details class="mt8"><summary style="cursor:pointer">'+esc(label)+'</summary><div class="effects mt8">'+Object.entries(values).map(([k,v])=>'<span class="effect">'+esc(D.skills[k])+' '+skillFmt(v)+'</span>').join('')+'</div></details>';
}
function creationStyleHint(id='balanced',start='kart'){
 const style=D.drivingStyles.find(x=>x.id===id)||D.drivingStyles[0];
 return styleDescription(style)+styleValues(G.startingSkills(start,style.id),'Startwerte ansehen · '+D.stages[start].name)+'<p class="faint mt8">Einmalige Talentwahl für diese Karriere. Positive Lernboni gelten bis zur Grenze 99; Verluste bleiben unverändert.</p>';
}
function legacyStyleHint(id='balanced'){
 const style=D.drivingStyles.find(x=>x.id===id)||D.drivingStyles[0];
 return styleDescription(style)+(style.fun?'<p class="mt8">Deine vorhandenen Fähigkeiten werden auf mindestens das Wunderkind-Startniveau angehoben. Bereits höhere Werte bleiben erhalten.</p>':'')+styleValues(G.previewDrivingStyle(S,style.id),'Deine Werte nach der Auswahl');

}

function pair(label,value){return '<div class="info-pair"><span>'+label+'</span><strong>'+value+'</strong></div>';}

}
function driverDevelopmentPanel(){
 return '<section class="panel mt24"><div class="panel-header"><h3>Entwicklung & Budget</h3>'+icon('briefcase')+'</div><p class="muted" style="font-size:12px;line-height:1.8">Investiere in Simulator, persönlichen Trainer, Mentalcoaching, Management, Lifestyle oder langfristige Beteiligungen. Ein Saisonplan mit optionaler Betreuung ergänzt deine Karriere, ohne zusätzliche Pflichtentscheidungen pro Rennen.</p>'+pair('Verfügbares Karrierebudget',esc(compactMoney(S.player.money)))+button('Entwicklung & Budget öffnen '+icon('arrow'),'nav','development','secondary full mt16')+button('Team, Vertrag & Förderung','nav','relationships','ghost full mt8')+'</section>';

function seasonPlanForm(){
 const info=G.quickInfo(S),plan=info.plan;
 if(plan){const focus=G.FOCUSES.find(f=>f.id===plan.focus),support=G.supportOffers(S).find(x=>x.id===plan.support);return '<section class="panel"><div class="panel-header"><h3>Dein Saisonplan '+S.year+'</h3>'+badge('FESTGELEGT','dim')+'</div>'+pair('Trainingsschwerpunkt',esc(focus.name))+pair('Rennansatz',esc({safe:'Kontrolliert',balanced:'Ausgewogen',attack:'Angriff'}[plan.approach]))+pair('Betreuung',esc(support.name))+pair('Bereits bezahlt',esc(compactMoney(plan.fee)))+'<p class="faint mt16" style="font-size:11px">Gilt bis zum Saisonende, auch wenn du den Spielmodus wechselst. Keine automatische Verlängerung oder Abbuchung.</p></section>';}
 if(S.phase!=='prep')return '<section class="panel"><h3>Dein Saisonplan</h3><p class="muted mt8" style="font-size:12px">Lege deinen Plan bei der nächsten Wochenend-Vorbereitung fest. Ein schon begonnenes Wochenende spielst du zuerst fertig. Der kostenlose Basisplan ist immer möglich.</p>'+button('Zur Karriere '+icon('arrow'),'nav',S.phase==='contract'?'market':'weekend','secondary mt16')+'</section>';
 return '<section class="panel"><div class="panel-header"><h3>Ein Plan für deine Saison</h3>'+badge('EINMAL PRO JAHR','dim')+'</div><p class="muted mb16" style="font-size:12px;line-height:1.8">Im Schnellmodus werden normale Trainings und Entscheidungen nach diesem Plan übernommen. Nur bei Highlights entscheidest du persönlich. Betreuung ist freiwillig und bringt keine sofortigen Statpunkte.</p><form id="season-plan-form"><div class="field-row"><div class="field"><label for="season-focus">Trainingsfokus</label><select id="season-focus" name="focus">'+G.FOCUSES.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select></div><div class="field"><label for="season-approach">Rennansatz</label><select id="season-approach" name="approach"><option value="safe">Kontrolliert (weniger Risiko)</option><option value="balanced" selected>Ausgewogen</option><option value="attack">Angriff (mehr Risiko)</option></select></div></div><div class="field"><label for="season-support">Betreuung bis Saisonende</label><select id="season-support" name="support">'+G.supportOffers(S).map(o=>'<option value="'+o.id+'" '+(o.cost>S.player.money?'disabled':'')+'>'+esc(o.name)+' · '+esc(compactMoney(o.cost))+'</option>').join('')+'</select><small id="support-hint" class="muted" style="font-size:11px;line-height:1.7">'+esc(G.supportOffers(S)[0].text)+'</small></div><p class="faint mb16" style="font-size:11px">Die angezeigte Zahlung wird einmal bei Bestätigung fällig. In einer laufenden Saison nur anteilig für verbleibende Wochenenden. Im Standardmodus bleibt deine manuelle Taktik maßgeblich.</p><button type="submit" class="btn full">Saisonplan festlegen '+icon('arrow')+'</button></form></section>';
}
function developmentPage(){
 const d=G.careerDevelopment(S),spent=d.ledger.filter(l=>l.year===S.year).reduce((n,l)=>n+l.amount,0);
 return pageHeading('FAHRER / ENTWICKLUNG','Investiere in deinen nächsten Schritt.','Keine gekauften Sofort-Stats. Deine Entscheidungen wirken langfristig.',button(icon('back')+' Zum Cockpit','nav','dashboard','ghost'))+'<div class="stats">'+stat('Verfügbar',esc(compactMoney(S.player.money)),'Dein Karrierebudget','briefcase')+stat('Dieses Jahr investiert',esc(compactMoney(spent)),'Ausbau und Betreuung','chart')+'</div><div class="notice info mb16">'+icon('info')+'<div>Ab 70, 80, 85 und 90 werden weitere Lernfortschritte bei normalen Talenten schrittweise kleiner. Investitionen helfen, machen dich aber nicht sofort zum Spitzenfahrer. Wunderkind bleibt ein bewusst leichter Spaß-Stil.</div></div>'+(S.journey?'<section class="panel"><h3>Automatische Vorbereitung</h3><p class="muted mt8">Kostenlos und ausgewogen. Vorhandene Investitionen und bereits bezahlte Betreuung wirken weiter. Keine neue Pflichtauswahl.</p></section>':seasonPlanForm())+'<h2 class="mt24 mb16">Deine dauerhaften Investitionen</h2><div class="grid2">'+G.investmentOffers(S).map(o=>'<section class="panel"><div class="panel-header"><h3>'+icon(o.icon)+' '+esc(o.name)+'</h3>'+badge('STUFE '+o.level+' / 3','dim')+'</div><p class="muted mb16" style="font-size:12px;line-height:1.8">'+esc(o.text)+'</p>'+progress(o.level/3*100)+pair('Nächste Stufe',o.level>=3?'Voll ausgebaut':esc(compactMoney(o.cost)))+button(o.level>=3?'Voll ausgebaut':o.available?'Ausbauen':'Aktuell nicht möglich','buy-investment',o.id,'secondary full mt16',o.available?'':'disabled')+'</section>').join('')+'</div><p class="faint mt16" style="font-size:11px">Käufe sind zwischen den Wochenenden und Saisons möglich, nicht während einer laufenden Vorbereitung oder eines Rennens. Kosten steigen mit Klasse und Ausbaustufe. Besitz bleibt beim Aufstieg erhalten; du bekommst kein Geld zurück.</p>'+duelPanel()+(d.ledger.length?'<details class="panel mt24"><summary>Deine letzten Ausgaben</summary><div class="mt16">'+d.ledger.slice(0,12).map(l=>pair(l.year+' · '+esc(l.title),'− '+esc(compactMoney(l.amount)))).join('')+'</div></details>':'');
}
function interviewPanel(){const i=G.pendingInterview(S);if(!i)return '';const press=i.kind==='press',conflict=i.kind==='conflict';return '<section class="panel decision-card mb16" data-interview><div class="eyebrow accent">'+(conflict?'TEAMKONFLIKT · ANTWORT ERFORDERLICH':press?'PRESSEKONFERENZ · ANTWORT ERFORDERLICH':'POST-RACE INTERVIEW · ANTWORT ERFORDERLICH')+'</div><h2 class="mt8">'+(conflict?'Die Stimmung wird öffentlich.':press?'Gemeinsame Pressekonferenz.':'Die Presse wartet auf dich.')+'</h2><blockquote>'+esc(i.question)+'</blockquote><div class="decision-choices">'+i.choices.map((c,index)=>'<button class="decision-choice" data-action="interview-answer" data-value="'+index+'"><span class="choice-number">'+(index+1)+'</span><span><b>'+esc(c.title)+'</b><small>„'+esc(c.text)+'“</small><small class="accent">'+esc(c.note)+'</small></span></button>').join('')+'</div><p class="faint mt16" style="font-size:10px">Deine gewählte Aussage erscheint anschließend als Fahrer-Interview in den News. Erst danach geht die Karriere weiter.</p></section>';}
function quickPage(){
 if(S.phase==='contract')return marketPage();if(S.phase==='season')return seasonPage();
 const info=G.quickInfo(S),interview=G.pendingInterview(S);
 if(!info.plan&&S.phase!=='prep')return '<div class="notice info mb16">'+icon('info')+'<div>Beende zuerst das bereits begonnene Wochenende. Anschließend kannst du den Saisonplan für den Schnellmodus festlegen.</div></div>'+normalWeekendPage();
 const pos=G.standings(S).find(x=>x.id==='player')?.position;
 let content=pageHeading('SCHNELLMODUS / '+S.year+' / '+G.competitionName(S),'Eine Saison. Wenige große Momente.','Normale Wochenenden automatisch. Nur bei Highlights entscheidest du selbst.')+'<div class="stats">'+stat('Gesamtstärke',G.overall(S.player)+' <small>/ 99</small>','Deine Fahrerentwicklung','chart')+stat('Meisterschaft',S.results.length?'P'+pos:'—',S.player.seasonPoints+' Punkte','cup')+stat('Rennen',info.completed+' <small>/ '+info.total+'</small>','Bereits abgeschlossen','flag')+stat('Karrierebudget',esc(compactMoney(S.player.money)),'Für Ausbau und Betreuung','briefcase')+'</div>';
 if(!info.plan)content+=seasonPlanForm();
 else{
  content+='<section class="panel mb16"><div class="panel-header"><h3>'+esc(S.phase==='story'?(info.current?.reason||'Persönliche Entscheidung'):'Deine nächste Etappe')+'</h3>'+badge('SCHNELL','dim')+'</div>'+progress(info.completed/info.total*100)+'<p class="muted mt16" style="font-size:12px;line-height:1.8">'+(S.phase==='story'?'Das Team hat die Vorbereitung übernommen. Diese Entscheidung in '+esc(G.track(S).name)+' gehört dir.':'Training, normale Entscheidungen, Qualifying und Rennen folgen deinem Saisonplan. Die Simulation stoppt vor der nächsten Highlight-Entscheidung oder am Saisonende.')+'</p>'+(S.phase==='story'?'':interview?'<div class="notice info mt16"><div><b>Interview offen</b><br>Beantworte zuerst die Pressefrage unten.</div></div>':button((S.results.length?'Weiter simulieren':'Bis zum nächsten Highlight')+' '+icon('arrow'),'quick-advance','','full mt16'))+'</section>';
  if(S.phase==='story')content+=storyPage();
  content+='<details class="panel mt24"><summary>Dein Saisonplan & Highlights</summary><div class="mt16">'+seasonPlanForm()+info.highlights.map(h=>pair('Rennen '+(h.round+1)+' · '+esc(h.name),esc(h.reason))).join('')+'</div></details>';
 }
 if(interview)content+=interviewPanel();
 if(S.results.length)content+='<section class="panel mt24"><div class="panel-header"><h3>Zuletzt: '+esc(S.lastResult.track)+'</h3>'+badge(S.lastResult.playerDnf?'DNF':'P'+S.lastResult.playerPosition)+'</div>'+pair('Punkte','+'+S.lastResult.points)+pair('Einnahmen',esc(compactMoney(S.lastResult.reward)))+'<details class="mt16"><summary>Alle bisherigen Rennergebnisse</summary><div class="table-wrap mt16"><table><thead><tr><th>Rennen</th><th>Ergebnis</th><th>Punkte</th></tr></thead><tbody>'+S.results.map(r=>'<tr><td>'+esc(r.track)+'</td><td>'+(r.dnf?'DNF':'P'+r.position)+'</td><td>'+r.points+'</td></tr>').join('')+'</tbody></table></div></details></section>';
 return content+driverDevelopmentPanel()+'<div class="mt24">'+promotionPanel()+'</div>'+duelPanel();
}
function specialRacePage(){const e=G.specialRaceEvent(S);if(!e)return '';const c=e.context||{},remaining=c.remainingLaps??Math.max(0,(G.track(S)?.laps||0)-Math.round((G.track(S)?.laps||0)*(S.race?.segment||0)/3));return pageHeading('RENNEN · SPEZIALEREIGNIS',e.title,'Deine Entscheidung verändert den laufenden Rennzustand.')+'<section class="panel decision-card special-event-card" data-special-race-event><div class="eyebrow accent">LIVE · '+esc(e.title)+'</div><h2 class="mt8">'+esc(e.title)+'</h2><p class="muted mt8">'+esc(e.text)+'</p><div class="grid2 mt16"><div class="info-pair"><span>Position</span><strong>'+(c.position?'P'+c.position:'—')+'</strong></div><div class="info-pair"><span>Reifenzustand</span><strong>'+Math.round(c.tyres??S.race?.tyres??0)+' %</strong></div><div class="info-pair"><span>Verbleibend</span><strong>'+remaining+' Runde'+(remaining===1?'':'n')+'</strong></div>'+(c.teammatePosition?'<div class="info-pair"><span>Teamkollege</span><strong>P'+c.teammatePosition+'</strong></div>':'')+'</div><div class="race-action-grid mt16">'+e.choices.map(x=>'<button type="button" class="race-action" data-action="special-race-choice" data-value="'+esc(x.id)+'" data-token="'+esc(e.token)+'"><b>'+esc(x.title)+'</b><small>'+esc(x.detail)+'</small></button>').join('')+'</div></section>';}
function specialRaceOutcome(){const e=S.journey?.lastSpecialEvent||S.careerDepth?.lastSpecialEvent;if(!e||e.year!==S.year||e.round!==S.round||!e.beforePosition||!e.afterPosition)return '';const delta=e.beforePosition-e.afterPosition,impact=delta>0?delta+' Position'+(delta===1?'':'en')+' gewonnen':delta<0?Math.abs(delta)+' Position'+(delta===-1?'':'en')+' verloren':'Position gehalten';return '<div class="notice '+(delta>0?'good':delta<0?'warn':'info')+' mb16"><div><b>'+esc(e.title||'Rennentscheidung')+': P'+e.beforePosition+' → P'+e.afterPosition+'</b><br>'+esc(e.choiceTitle||'Entscheidung')+' · '+impact+' · Reifen '+Math.round(e.tyresBefore)+' % → '+Math.round(e.tyresAfter)+' %</div></div>';}
function weekendPage(){if(G.specialRaceEvent(S))return specialRacePage();return specialRaceOutcome()+(S.mode==='quick'?quickPage():normalWeekendPage());}
let pendingPlan=null;

function driverTable(rows,kind='standings'){const result=kind==='result',quali=kind==='quali';return '<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>Fahrer</th><th>Team</th><th>'+(quali?'Rundenzeit':result?'Rückstand':'Siege')+'</th><th class="td-right">'+(quali?'Abstand':result?'Punkte':'Punkte')+'</th></tr></thead><tbody>'+rows.map(d=>{const tm=G.team(S,d.teamId);return '<tr class="'+(d.id==='player'?'you':'')+'"><td class="td-pos">'+String(d.position).padStart(2,'0')+'</td><td><div class="td-name">'+flag(d.country)+'<div><b>'+esc(d.name)+'</b>'+(d.id==='player'?'<small>Dein Fahrer · #'+S.player.number+'</small>':'')+'</div>'+(d.id==='player'?badge('DU','tiny'):'')+'</div></td><td class="td-team"><div class="row"><span class="team-dot" style="--tc:'+tm.color+'"></span>'+esc(tm.name)+'</div></td><td class="mono">'+(quali?(d.invalid?'UNGÜLTIG':lapTime(d.time)):result?(d.dnf?'DNF · '+esc(d.reason):d.position===1?'SIEGER':'+'+d.gap.toFixed(2)+' s'):d.wins)+'</td><td class="td-points">'+(quali?(d.invalid?'—':d.position===1?'—':'+'+d.gap.toFixed(2)):d.points)+'</td></tr>';}).join('')+'</tbody></table></div>';}

function racePage(){const r=S.race,p=G.raceOrder(S).find(x=>x.id==='player'),t=G.track(S),phase=['Startphase','Rennmitte','Finale'][r.segment];return '<div class="split"><section class="panel race-control"><div class="row between"><div><div class="eyebrow accent">'+esc(phase)+' · ABSCHNITT '+(r.segment+1)+' / 3</div><div class="big-pos mt8">'+(p.dnf?'DNF':'P'+p.position)+'</div></div><div class="lap">Runde<br><b>'+Math.round(t.laps*r.segment/3)+'</b> / '+t.laps+'</div></div>'+mapSVG(t,true)+'<div class="grid2" style="grid-template-columns:1fr 1fr"><div class="skill"><div class="row between"><span>Reifenzustand</span><strong>'+Math.round(r.tyres)+' %</strong></div>'+progress(r.tyres,r.tyres<35?'#f3aa7b':'var(--accent)')+'</div><div class="skill"><div class="row between"><span>Energie</span><strong>'+Math.round(S.player.energy)+' %</strong></div>'+progress(S.player.energy,'#8fbcf7')+'</div></div>'+(p.dnf?'<div class="notice warn mt16">'+icon('info')+'Dein Rennen ist beendet. Auch aus einem schwierigen Wochenende lernst du.</div><div class="mt16">'+button('Rennen zu Ende verfolgen '+icon('arrow'),'watch','','full')+'</div>':'<h3 class="mt16">Wie fährst du diesen Abschnitt?</h3><div class="race-action-grid">'+[['safe','Kontrolliert','Wenig Risiko, Reifen schonen.','shield'],['balanced','Ausgewogen','Tempo und Reserven abwägen.','target'],['attack','Attackieren','Mehr Tempo, mehr Verschleiß und Fehlerrisiko.','bolt']].map(([id,title,note,ico])=>'<button class="race-action '+(id==='balanced'?'recommended':'')+'" data-action="race-step" data-value="'+id+'">'+icon(ico)+'<b>'+title+'</b><small>'+note+'</small></button>').join('')+'</div>')+'</section><section class="panel"><div class="panel-header"><h3>Auf der Strecke</h3>'+badge('ABSCHNITTSWEISE','dim')+'</div>'+liveTable()+'<p class="faint mt16" style="font-size:10px">Positionen ändern sich nach deiner Entscheidung. Die Karte ist eine schematische Visualisierung.</p></section></div><div class="log" role="log" aria-live="polite">'+r.logs.map(l=>'<div class="log-line '+esc(l.kind)+'">'+esc(l.text)+'</div>').join('')+'</div>';}
function resultsPage(){const r=S.lastResult,p=r.rows.find(d=>d.id==='player'),last=S.round+1===G.calendar(S).length,interview=G.pendingInterview(S),title=p.dnf?'Ein Rückschlag ist nicht das Ende.':p.position===1?'Dein Moment auf der obersten Stufe.':p.position<=3?'Ein Podium für die Geschichte.':p.points?'Wichtige Punkte auf deinem Weg.':'Erfahrung, auf der du aufbauen kannst.';const next=interview?'':button((last?'Saison abschließen':'Nächstes Wochenende')+' '+icon('arrow'),'next');const bottom=interview?'':button((last?'Zur Saisonbilanz':'Weiter zum nächsten Wochenende')+' '+icon('arrow'),'next','','full');return '<section class="result-banner"><div class="row"><div class="result-pos">'+(p.dnf?'DNF':'P'+p.position)+'</div><div><div class="eyebrow">ZIELFLAGGE · '+esc(r.track)+'</div><h2>'+title+'</h2><p>'+(p.dnf?'Ursache: '+esc(p.reason):'Start P'+p.grid+' · '+(p.gain>=0?'+':'')+p.gain+' Positionen')+'</p></div></div><div class="result-mini"><div><b>+'+r.points+'</b><span>Punkte</span></div><div><b>+'+r.growth+'</b><span>Gesamtstärke</span></div><div><b>'+esc(compactMoney(r.reward))+'</b><span>Einnahmen</span></div></div></section>'+interviewPanel()+'<div class="row between wrap mb16"><h3>Das Rennergebnis</h3>'+next+'</div><div class="podium">'+r.rows.slice(0,3).map(d=>'<div class="podium-place"><div class="podium-rank">0'+d.position+'</div><div><b>'+esc(d.name)+'</b><small>'+esc(G.team(S,d.teamId).name)+'</small></div></div>').join('')+'</div>'+driverTable(r.rows,'result')+'<div class="log">'+r.logs.slice(-4).map(l=>'<div class="log-line '+esc(l.kind)+'">'+esc(l.text)+'</div>').join('')+'</div>'+(bottom?'<div class="mt24">'+bottom+'</div>':'<div class="notice info mt24"><div><b>Beantworte zuerst das Interview.</b><br>Danach kannst du zum nächsten Wochenende beziehungsweise zur Saisonbilanz weitergehen.</div></div>');}

function modePanel(){return '<section class="panel mt24"><div class="panel-header"><h3>Spielmodus</h3>'+badge(modeLabel())+'</div><p class="muted" style="font-size:12px;line-height:1.8"><b>Schnell – kompakte Karriere:</b> Wenige wichtige Entscheidungen, automatische Vorbereitung und Rennen. Kein Pflichttraining.<br><b>Bestehender Schnellablauf:</b> Alte Spielstände behalten ihren Saisonplan. Unten kannst du die neue kompakte Variante ausdrücklich aktivieren.<br><b>Karriere-Fokus:</b> Du wählst Training, Entscheidungen und Teams. Qualifying und Rennen übernimmt dein Team automatisch.<br><b>Standard – ausführliche Karriere:</b> Du bestimmst zusätzlich Qualifying-Taktik, Rennstrategie und drei Rennabschnitte.</p><div class="row wrap mt16">'+[['quick','Schnell (bisheriger Ablauf)'],['career','Karriere-Fokus'],['standard','Standard – ausführlich']].map(([id,label])=>button(label,'set-mode',id,S.mode===id?'':'secondary','aria-pressed="'+(S.mode===id)+'" '+(S.mode===id?'disabled':''))).join('')+'</div><p class="faint mt16" style="font-size:11px">Jederzeit umschaltbar. Fahrer, Fortschritt, Ergebnisse und laufende Rennen bleiben erhalten.</p></section>';}
function titleSummary(s){const b=G.titleBreakdown(s),labels={kart:'Kart',f4:'F4',f3:'F3',f2:'F2',f1:'F1',wtv:'WTV'},parts=Object.keys(labels).filter(k=>b[k]>0).map(k=>labels[k]+' '+b[k]);if(b.unassigned)parts.push('ältere Titel '+b.unassigned);return parts.length?parts.join(' · '):'Noch kein Meistertitel';}
function profilePage(){const p=S.player,stats=p.stats;const achievements=[['Der Anfang',stats.races>0,'Dein erstes Rennen abgeschlossen.'],['Auf dem Podium',stats.podiums>0,'Zum ersten Mal unter den besten drei.'],['Siegermentalität',stats.wins>0,'Deinen ersten Rennsieg feiern.'],['Meisterstück',stats.titles>0,'Eine Fahrermeisterschaft gewinnen.'],[S.wtv?'WTV-Starter':'Königsklasse',S.stage==='f1',S.wtv?'Ein Cockpit in deiner WTV-Spielwelt besetzen.':'Ein Cockpit in der Formel 1 erreichen.'],[S.wtv?'Liga-Meister':'Weltmeister',stats.f1titles>0,S.wtv?'Eine WTV-Spielmeisterschaft gewinnen.':'Die Formel-1-Meisterschaft gewinnen.']];return pageHeading('FAHRERPROFIL','Du bist dein wichtigstes Projekt.','Entwickle dein Talent, investiere dein Budget und verfolge das Teamduell.')+'<section class="profile-hero"><span class="profile-number">'+p.number+'</span><div class="profile-avatar">'+esc(initials(p.name))+'</div><div class="profile-info"><div class="eyebrow accent">#'+p.number+' · '+esc(countryName(p.country))+'</div><h2 class="mt8">'+esc(p.name)+'</h2><p>'+p.age+' Jahre · '+esc(G.team(S)?.name||'Auf Teamsuche')+'</p>'+badge('Karrieretitel · '+esc(titleSummary(S)))+'</div><div class="profile-rating">'+G.overall(p)+'<small>GESAMT</small></div></section><div class="stats">'+stat('Karrierestarts',stats.races,'Alle Klassen zusammen','flag')+stat('Siege',stats.wins,stats.podiums+' Podiumsplätze','cup')+stat('Polepositions',stats.poles,'Schnellste Qualifying-Runden','clock')+stat('Bekanntheit',Math.round(p.reputation)+' <small>/ 100</small>','Dein Ruf in der Spielwelt','star')+'</div><div class="split"><section class="panel"><div class="panel-header"><h3>Deine Fähigkeiten</h3>'+badge('1–99','dim')+'</div>'+skillBars()+'<div class="notice info mt24">'+icon('info')+'<div>Die Gesamtstärke ist der Mittelwert aller sieben Fähigkeiten. Im Qualifying zählen andere Schwerpunkte als im Rennen.</div></div></section><section class="panel"><div class="panel-header"><h3>Deine Meilensteine</h3>'+icon('cup')+'</div>'+achievements.map(([title,earned,desc])=>'<div class="achievement '+(earned?'earned':'')+'">'+icon(earned?'cup':'lock')+'<div><b>'+title+'</b><small>'+desc+'</small></div></div>').join('')+'</section></div>'+driverDevelopmentPanel()+duelPanel()+drivingStylePanel()+modePanel()+'<section class="panel mt24"><div class="panel-header"><h3>Als Teamchef spielen</h3>'+badge('NEUER MODUS','dim')+'</div><p class="muted" style="font-size:12px">Fahrer verpflichten, Sponsoren wählen und ganze Saisons simulieren. Deine Fahrerkarriere bleibt separat gespeichert.</p><div class="mt16">'+button(icon('briefcase')+' Manager-Modus öffnen','manager-open')+'</div></section><section class="panel mt24"><h3>Deine Sicherung</h3><p class="muted mt8" style="font-size:12px">Automatisch gespeichert wird nur in diesem Browser. Eine JSON-Sicherung nimmt deine komplette Spielwelt mit.</p><div class="row wrap mt16">'+button(icon('download')+' Spielstand exportieren','export','', 'secondary')+button(icon('upload')+' Spielstand importieren','import','','ghost')+'</div></section>';}
function archivePage(){const world='<section class="panel mb16 world-archive-entry"><div class="panel-header"><div><div class="eyebrow accent">NEWS & SILLY SEASON</div><h3>Karrierewelt</h3></div>'+icon('news')+'</div><p class="muted" style="font-size:12px">Transfers, Teamchef-Statements, Karriere-Zeitleiste, Rekordbuch und Rivalitäten findest du hier direkt.</p><div class="mt16">'+button('News & Karrierewelt öffnen '+icon('arrow'),'nav','careerworld','full')+'</div></section>';const history=S.archive.length?'<div class="stack">'+S.archive.map((a,i)=>'<button class="panel archive-card" data-action="archive-detail" data-value="'+i+'" style="color:var(--text);text-align:left"><div class="archive-year">'+a.year+'</div><div class="archive-info"><div class="eyebrow">'+esc((S.wtv?G.competitionName(S):D.stages[a.stage].name))+'</div><h3>'+esc(a.teamName)+'</h3><p>'+a.points+' Punkte · '+a.wins+' Siege · '+a.podiums+' Podien</p></div><div class="archive-result '+(a.position===1?'accent':'')+'">P'+a.position+'</div>'+icon('chevron')+'</button>').join('')+'</div>':'<div class="empty">'+icon('archive')+'<h3>Das erste Kapitel wird gerade geschrieben.</h3><p>Nach dem ersten Jahreswechsel findest du hier deine abgeschlossenen Saisons – inklusive Ergebnissen und Meisterschaftsständen.</p></div>';return pageHeading('DEINE GESCHICHTE','Jede Saison hinterlässt Spuren.','Ergebnisse, Teams und Meilensteine bleiben in deinem Spielstand erhalten.')+world+history+'<section class="panel mt24"><div class="panel-header"><h3>Das Fahrerlager lebt weiter</h3>'+button('Fahrer & Verträge','nav','roster','small ghost')+'</div><p class="muted" style="font-size:12px">Auch während deines Aufstiegs entwickeln sich die anderen Klassen. Fahrer verlängern, wechseln Teams oder machen Platz für den Nachwuchs.</p></section>';}

function render(){if(!S){$('#app').innerHTML=welcome();window.AufstiegReleaseUI.decorate('career',null,view);return;}let html;if(S.careerEnd){if(view==='careerworld'){$('#app').innerHTML=shell(window.AufstiegReleaseUI.careerWorldPage(S));window.AufstiegReleaseUI.decorate('career',S,view);return;}$('#app').innerHTML=shell(careerEndingPage());window.AufstiegReleaseUI.decorate('career',S,view);return;}const f={life:()=>window.AufstiegReleaseUI.lifePage(S),careerworld:()=>window.AufstiegReleaseUI.careerWorldPage(S),dashboard,development:developmentPage,relationships:()=>E.careerPage(S),market:marketPage,roster:rosterPage,weekend:weekendPage,standings:standingsPage,profile:profilePage,archive:archivePage};if(!f[view])view='dashboard';const compact=S.journey&&S.mode==='quick';html=compact&&['dashboard','weekend','market','profile','archive'].includes(view)?window.AufstiegJourneyUI.page(S,view):f[view]();if(view==='profile'&&!compact)html+=E.slotEntry('career')+'<div class="mt16">'+button('Team, Vertrag & Förderung','nav','relationships','secondary full')+'</div>';$('#app').innerHTML=shell(html);window.AufstiegReleaseUI.decorate('career',S,view);window.AufstiegJourneyUI.decorate(S,view);}
function help(){showDialog('So spielst du Aufstieg','<h3>Neu in 0.32: Farben & Kategorie-Badges in den News</h3><p>Die Karrierewelt lässt sich jetzt schneller überblicken: Vertragsverlängerungen, Beförderungen, Neuverpflichtungen, Siege und Podien tragen einen grünen Akzent; Trennungen und DNFs einen roten. Sport- und Interviewmeldungen sind blau, Teamwechsel orange, besondere Meilensteine violett. Ein feststehender F1-Weltmeister erhält als seltenes Highlight eine goldene Karte. Jede Farbe wird zusätzlich durch ein Text-Badge und Symbol erklärt.</p><h3>Weiterhin aus 0.31: weniger Interview-Pflicht, stärkere Konkurrenz</h3><p>Ein normales Podium löst nur noch selten ein Interview aus. Nach einem beantworteten eigenen Interview sind die nächsten zwei Rennen interviewfrei. Erster F1-Sieg, erstes Podium und ein feststehender WM-Titel dürfen diese Pause als besondere Meilensteine umgehen. Auch KI-Interviews erscheinen seltener und derselbe Fahrer wird nicht ständig direkt wieder ausgewählt.</p><p>Für lange F1-Karrieren entstehen häufiger echte Elite-Rivalen mit hoher Entwicklungsspitze. Sehr starke KI-Fahrer halten ihr Niveau etwas länger, Nachwuchsfahrer können glaubwürdiger zu 94–98er-Piloten heranwachsen und die Teamstärken bewegen sich in mehrjährigen Entwicklungszyklen stärker. Die bereits gewonnenen Titel werden nicht verändert und dein Fahrer erhält keinen künstlichen Pace-Malus.</p><h3>Weiterhin aus 0.30: abwechslungsreiche News-Längen</h3><p>Die Karrierewelt mischt jetzt kurze Meldungen mit ausführlicheren Artikeln. Besonders wichtige Ereignisse wie Weltmeisterschaften, erste Siege, Rookie-Durchbrüche oder DNFs im Titelkampf können mehrere Sätze und einen zweiten Absatz erhalten. Auch Interviews und manche Vertragsmeldungen werden gelegentlich ausführlicher. Die Texte greifen dabei nur auf tatsächlich simulierte Ergebnisse, WM-Stände und Vertragsvorgänge zurück.</p><h3>Weiterhin aus 0.29: dynamische Fahrer-Interviews</h3><p>Nach passenden Rennsituationen kann ein Interview entstehen. Bei deinem Fahrer musst du eine von drei situationsabhängigen Antworten wählen, bevor die Karriere weitergeht. Die gewählte Aussage erscheint als <b>Fahrer-Interview · Spiel</b> in der Karrierewelt. Auch KI-Fahrer können automatisch Interviews geben – zum Beispiel nach Siegen, DNFs, Podien, verlorenen Chancen, Rookie-Auftritten oder im WM-Kampf. Interviews kommen bewusst nicht nach jedem Rennen.</p><h3>Weiterhin aus 0.28: lebendigere Fahrerlager-News</h3><p>Vertrags- und Transfermeldungen variieren ihre Formulierungen. Zusätzlich können erster F1-Sieg, erstes Podium, starke Rookie-Rennen, besondere Siege, wichtige DNFs im WM-Kampf und der Weltmeister als News erscheinen.</p><h3>Weiterhin aus 0.27: News & Silly Season sofort erreichbar</h3><p>In der Fahrerkarriere findest du oben dauerhaft den klar beschrifteten Button <b>News</b>. Er öffnet direkt Silly Season, Karriere-Zeitleiste, Rekordbuch und Rivalitäten. Im normalen Archiv steht derselbe Einstieg jetzt direkt vor der Saisonliste statt darunter.</p><h3>Weiterhin aus 0.26: schnellere Teamdynamik & WM-Rollen</h3><p>Teamvertrauen, Teamkollegen- und Renningenieur-Chemie reagieren spürbarer auf gemeinsame Saisons und wichtige Entscheidungen. Gute Zusammenarbeit kann schneller wachsen; klare Konfliktentscheidungen können Beziehungen ebenso deutlicher verschlechtern. Ein amtierender F1-Weltmeister, der seinen Teamkollegen schlägt und ausreichend Teamvertrauen besitzt, wird bei einem laufenden Vertrag nun sehr wahrscheinlich zum Führungsfahrer aufgewertet. Bei neuen Vertragsangeboten berücksichtigt die Teamrolle einen gerade gewonnenen WM-Titel ebenfalls stärker.</p><h3>Weiterhin aus 0.25: Karrierewelt am Handy sichtbar</h3><p>Im Schnellmodus gibt es unten den eigenen Menüpunkt <b>Welt</b>. Darüber öffnest du Silly Season, Karriere-Zeitleiste, Rekordbuch und Rivalitäten direkt. Im Archiv steht der gleiche Einstieg ganz oben statt erst nach der Saisonliste.</p><h3>Weiterhin aus 0.24: Karrierewelt, Silly Season & Rekorde</h3><p>Im Profil und Archiv findest du jetzt die Karrierewelt: Silly-Season-News aus den tatsächlichen F1-Transfers deiner Spielwelt, eine Karriere-Zeitleiste, ein Rekordbuch und Rivalitäten mit gemeinsamer Geschichte. Transfermeldungen erklären den sportlichen Grund und enthalten klar als Spiel gekennzeichnete, fiktive Teamchef-Statements. Es werden keine echten Aussagen realer Personen zitiert. Die Karriere-Zeitleiste und Rekorde werden aus deinem gespeicherten Saisonarchiv aufgebaut; ältere Saves können deshalb weiterverwendet werden.</p><h3>Weiterhin aus 0.23: Rookie-Mentoring</h3><p>Wenn du als etablierter F1-Fahrer in einem starken Team einen Rookie als Teamkollegen bekommst, kann ein seltenes Mentoren-Ereignis erscheinen. Du kannst den Rookie aktiv mit Daten, Abläufen und Erfahrung unterstützen oder ihn selbst lernen lassen. Hilfe verbessert eure Beziehung und kann seine Entwicklung beschleunigen – wie stark, hängt von seinem verborgenen Potenzial ab. Du siehst dieses Potenzial weiterhin nicht. Ein außergewöhnliches Talent kann durch deine Hilfe später tatsächlich zu einem Rivalen um Siege oder Titel werden. Nicht helfen ist neutral: kein versteckter Malus und keine künstliche Beziehungsstrafe.</p><h3>Weiterhin aus 0.22: Teamdynamik & Renningenieur</h3><p>Die Beziehung zu deinem Renningenieur wächst natürlich durch gemeinsame Rennwochenenden und abgeschlossene Saisons. Der passive Zuwachs wird mit hoher Chemie kleiner, damit 90–100 nicht automatisch entsteht. Technische Zusammenarbeit und passende Entscheidungen können zusätzlich helfen. Eine angespannte Teamkollegenbeziehung kann sich über konfliktfreie Saisons langsam Richtung neutral erholen, wird aber nicht allein durch Zeit automatisch freundschaftlich.</p><h3>Weiterhin aus 0.21: Meistertitel nach Klasse</h3><p>Das Fahrerprofil trennt deine Meisterschaften jetzt nach Kart, F4, F3, F2 und F1. So werden frühere Nachwuchstitel nicht mehr so dargestellt, als wären sie Titel der aktuell gefahrenen Serie. Die Juniorserien-Balance wurde dafür nicht verändert; die F1-Elite-Kompression oberhalb 90 greift weiterhin nur in der Formel 1.</p><h3>Weiterhin aus 0.20: Teamrollen & Reservekarriere</h3><p>Führungsfahrer, Gleichberechtigt und Zweiter Fahrer haben echte Vertragsbedeutung. Die Rolle verändert nicht heimlich deine reine Fahrzeugpace, sondern unter anderem Gehalt, Erwartungsdruck, Einfluss und die Wahrscheinlichkeit von Teamorders. Bei Mehrjahresverträgen kann sich die Rolle nur zwischen zwei Saisons und höchstens um eine Stufe verändern. Starke Leistungen können dich vom Zweiten Fahrer bis zum Führungsfahrer bringen; schwache Jahre können eine Rückstufung auslösen. Eine Fahrerklausel wegen Rollenherabstufung schützt nur die beim Unterschreiben garantierte Rolle und wird einem bereits als Zweiter Fahrer unterschreibenden Fahrer nicht mehr sinnlos angeboten.</p><p>Ein echter F1-Reservevertrag ist ein klarer Karriereweg: besonders nach F2 können Teams Reserve- oder Entwicklungsangebote machen. Ein Reservejahr plant 1 bis 3 mögliche Grand-Prix-Vertretungen; starke Einsätze können eine Beförderung zum Zweiten Fahrer auslösen. Ein Entwicklungsvertrag bleibt dagegen primär Simulator/Test und verspricht keine GP-Starts.</p><h3>Weiterhin aus 0.19: individuelle Prime, Langlebigkeit & Alterung</h3><p>Fahrer altern nicht mehr nach derselben Kurve. Im Hintergrund besitzt jeder Fahrer ein eigenes Entwicklungstempo, eine individuelle Prime-Dauer, Langlebigkeit und einen eigenen Abbauverlauf. Diese Werte werden nicht als Zahlen eingeblendet. Sichtbar ist nur die aktuelle Stärke. Pace und Fitness bauen im Mittel schneller ab als erfahrungsbasierte Bereiche wie Rennintelligenz, Technik und Reifenmanagement. Ein älterer Fahrer mit weiterhin hoher Stärke und starken Resultaten kann deshalb weiterhin für Topteams interessant sein; Alter allein sperrt kein Cockpit und öffnet keinen laufenden Vertrag. Veteranen erhalten im Schnitt vorsichtigere Vertragslaufzeiten, Elitefahrer können aber weiterhin mehrjährige Angebote bekommen. Die aktive Fahrerkarriere endet nach der Saison im Alter 44.</p><h3>Weiterhin aus 0.18: Fahrerwelt, Talentsuche & Teaminteresse</h3><p>Die sichtbare Gesamtstärke bleibt der aktuelle Leistungswert. Im Hintergrund entwickeln sich KI-Fahrer über verborgenes Potenzial, sodass auch in langen Karrieren neue starke und gelegentlich echte Elitefahrer entstehen. Teams verpflichten ihre Fahrer nach sportlicher Stärke, beobachtbarer Entwicklung, Fahrerwünschen und Teamniveau. Andere F1-Teams können sich außerdem von sich aus bei deinem Management melden. Solche Kontakte umgehen weder deinen Vertrag noch deine Ausstiegsklausel und verpflichten dich zu nichts.</p><h3>Weiterhin aus 0.17: Verträge, Leistungsdruck & Restdistanz</h3><p>Ohne Fahrerausstiegsklausel bleibt ein laufender Mehrjahresvertrag bindend; direkte Angebote reichen bis maximal fünf Saisons. Teamabhängige Saisonziele, sichtbarer Klauselstatus sowie Safety-Car-/Rote-Flagge-Entscheidungen mit ungefährer Restdistanz und Reifenwirkung bleiben erhalten.</p><h3>Schnell: Aufstieg × Karrierestory (0.23)</h3><p>Vertrag auswählen, zwei wichtige Entscheidungen treffen und die Saisonbilanz ansehen. Nach der ersten Antwort wird direkt die erste Hälfte simuliert, nach der zweiten die zweite Hälfte. Kein Pflichttraining und keine zusätzliche Bestätigung zwischen den Entscheidungen. Marktwert, Gehalt und WM-Stände bleiben oben erreichbar. Sponsoren, Teamförderung und Investitionen sind unter Optionale Entscheidungen &amp; Details freiwillig verfügbar. Es werden keine bezahlten Leistungen automatisch gekauft.</p><p>Alte Schnell-Spielstände behalten laufende Ereignisse. Unter Profil → Neuer Schnellablauf kannst du an der Saisonbilanz, am Fahrermarkt oder vor dem ersten Ereignis auf den neuen Ablauf wechseln. Vorher eine JSON-Sicherung exportieren. Die Vergleichsspiel-Datei bleibt separat und ihre Spielstände sind nicht mit dem Hauptspiel kompatibel.</p><h3>WTV seit 0.9</h3><p>WTV für Fahrer und Manager: Liga 1 oder Liga 2 wählen und mit vorhandener Figur/Team oder einem eigenen Einstieg starten. Neue Saison, 12 vorläufige Spielrennen; Reserve und fiktive Ersatzcockpits sind getrennt. WTV-Daten am oberen Ligahinweis ansehen. Startet nur auf einem freien Speicherplatz.</p><h3>Seit 0.8</h3><p>Schwierigkeit getrennt vom Spielmodus, eigene Sponsoren, Rivalitäten, wechselnde Rennform und Teamwirtschaft. Helles Design ist oben umschaltbar. Sponsorangebote findest du nach Teamwahl vor dem ersten Training unter Sponsoren & Rivalitäten.</p><h3>Weiterhin enthalten seit 0.7</h3><p><b>Fahrer:</b> Teamvertrauen, Teamrollen, Vertragsverhandlungen und freiwillige Akademien unter Profil → Team, Vertrag & Förderung. <b>Manager:</b> Personal und Nachwuchs in der Zentrale; ein Auto-Profil mit Streckenspezialisierung in der Entwicklung. Alle Zusatzkosten stehen in der Budgetvorschau. <b>Spielstände:</b> Je drei Plätze für Fahrer und Manager, mit Rückfallsicherung vor dem Jahreswechsel. Meldungen entstehen aus deinen Spielergebnissen, ohne Online-KI.</p><h3>Weiterhin enthalten</h3><p><b>Ältere Schnell-Spielstände ohne kompakte Karriere:</b> Ein Saisonplan und nur zwei bis drei Highlight-Entscheidungen statt Pflichtklicks vor jedem Rennen. <b>Profil → Entwicklung & Budget:</b> Dauerhafte Investitionen und freiwillige Saison-Betreuung. Gute Fahrer entwickeln sich langsamer weiter; Wunderkind bleibt bewusst einfacher. Ein hohes Fahrer-Rating allein reicht mit einem schwachen F1-Auto nicht zum Sieg.</p><h3>Standard und Karriere-Fokus: ausführliche Spielweisen</h3><p>Dies ist ein <b>rundenbasiertes Karrierespiel</b>, kein Fahrspiel mit Lenkradsteuerung. Du triffst die Entscheidungen, die Engine simuliert Qualifying und Rennen.</p><ol><li><b>Team wählen:</b> Stärke, Förderung und Budget vergleichen. Förderplätze verhindern eine Karrieresackgasse.</li><li><b>Vorbereiten:</b> Ein Training wählen und auf deine Energie achten.</li><li><b>Entscheiden:</b> Jede Antwort hat angezeigte Vor- und Nachteile.</li><li><b>Rennwochenende:</b> Im Karriere-Fokus genügt nach deiner Vorbereitung und Fahrerlagerentscheidung ein Klick auf „Wochenende simulieren“. Im Standardmodus bestimmst du Qualifying-Taktik, Rennstrategie und drei Rennabschnitte selbst.</li><li><b>Aufsteigen:</b> Erfülle zum Saisonende die geforderte Platzierung und Gesamtstärke.</li></ol><p><b>Modus wechseln:</b> Im Fahrerprofil unter „Spielmodus“. Bei Standard, Karriere-Fokus und älteren Saisonplan-Spielständen geht das auch in einer laufenden Karriere. Die kompakte Karriere bleibt auf ihrem Jahresablauf; für eine ausführliche Variante nutze einen anderen Speicherplatz. Fortschritt und bereits gefahrene Rennabschnitte bleiben erhalten.</p><h3>Fahrstile</h3><p>Beim Karrierestart wählst du Ausgeglichen, Schnell, Technisch, Konstant oder Wunderkind. Normale Stile verteilen deine Startfähigkeiten neu und setzen unterschiedliche Lernschwerpunkte. Wunderkind ist bewusst leichter: alle Startwerte +24, positive Entwicklung etwa ×1,65, maximal 99 pro Fähigkeit. Auch hier wird die Entwicklung nahe 99 deutlich langsamer. Verluste, Kosten und Rennrisiken bleiben bestehen. Der Stil wird einmal festgelegt und wirkt in allen drei Fahrer-Modi, nicht im Manager. Alte Spielstände können einmalig im Profil einen Stil wählen, sobald kein Wochenende mehr läuft oder noch keine Vorbereitung gewählt wurde.</p><h3>Speichern ohne Konto</h3><p>Das Spiel versucht nach jeder Aktion, lokal in diesem Browser zu speichern. <b>Privatmodus, Dateivorschau, Browserwechsel oder gelöschte Websitedaten können diesen Speicher verlieren.</b> Exportiere regelmäßig eine JSON-Sicherung. Zum Übertragen auf einen anderen Browser importierst du diese Datei.</p><h3>Ein eigenständiger Prototyp</h3><p>Kurzkalender, eine Rennwertung pro Wochenende und vereinfachte Aufstiegsregeln. Die bestehende Website wird nicht verändert. JSON-Sicherungen dieser Dateiversion ab v0.1 bleiben nutzbar; Spielstände des anderen Website-Projekts sind nicht kompatibel. Dateien am PC herunterladen und im Browser öffnen; eine iPhone-Dateivorschau ist kein vollwertiger Testbrowser.</p>'+ (S?'<div class="row wrap mt16">'+button(icon('download')+' Export','export','','small secondary')+button(icon('upload')+' Import','import','','small ghost')+button('Neue Karriere','new','','small ghost')+'</div>':''),button('Daten & Quellen','sources','','ghost')+button('Alles klar','close'));}
function sources(){showDialog('Daten, Spielwelt & Quellen','<h3>Reale Namen, simulierte Karriere</h3><p>Teamnamen und die F1-/F2-/F3-Startbesetzungen orientieren sich an den offiziellen 2026-Listen. Abgerufen am <b>17. September 2026</b>. Kart und F4 verwenden ausgewählte reale Teams mit fiktiven Nachwuchsfahrern.</p><p><b>Teamstärken, Ratings, Alterswerte, Vertragslaufzeiten, Gehälter, Budgets und alle späteren Wechsel sind Spielwerte.</b> Die Saison beginnt in einer eigenen 2026-Spielwelt, nicht mitten im aktuellen echten Meisterschaftsstand.</p><p>Der Kalender ist gekürzt, Streckenskizzen sind schematisch. Rennformate, Startfeldgrößen im Kart/F4 und Aufstiegsbedingungen sind vereinfacht. Es gibt keine originalgetreue FIA-Lizenz- oder Superlizenzprüfung.</p><h3>Nachgeschlagene Quellen</h3>'+D.sources.map(([label,url])=>'<a class="source-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' ↗</a>').join('')+'<h3>Unabhängiges Fanprojekt</h3><p>Keine Verbindung zu oder offizielle Lizenz von Formula 1, FIA, Rennteams oder Fahrern. Keine offiziellen Logos, Fahrerfotos, Musik oder Fahrzeugmodelle eingebunden. Die Nennung realer Marken allein bedeutet keine Freigabe für eine öffentliche Veröffentlichung.</p>');}

function creationFields(custom=false){return custom?'<div class="field mt16"><label for="m-name">Dein Teamname</label><input id="m-name" name="name" placeholder="z. B. Trefflinger Racing" minlength="2" maxlength="40" required></div><div class="field-row"><div class="field"><label for="m-color">Teamfarbe</label><select id="m-color" name="color"><option value="#b8ed62">Grün</option><option value="#6b9cf7">Blau</option><option value="#ff6464">Rot</option><option value="#ffa85c">Orange</option><option value="#aeb3ff">Violett</option><option value="#d9e4eb">Silber</option></select></div><div class="field"><label for="m-country">Land</label><select id="m-country" name="country">'+D.countries.map(c=>'<option value="'+c[0]+'">'+esc(c[1])+'</option>').join('')+'</select></div></div><p class="muted mb16" style="font-size:12px">Du ergänzt das Feld als zwölftes Team: <b>30 Mio. € Startbudget</b>, Teamstärke 64 und zwei günstige Nachwuchsfahrer. Beide Cockpits kannst du neu besetzen.</p>':'<div class="field mt16"><label for="m-team">Team übernehmen</label><select id="m-team" name="teamId">'+D.f1.map(t=>'<option value="f1-'+t[1].toLowerCase()+'">'+esc(t[0])+' · Stärke '+t[2]+'</option>').join('')+'</select></div><div id="m-team-preview" class="mt16 mb16">'+teamPreview('f1-mer')+'</div>';}

imuliert.</span><button class="text-btn" data-action="m-help">Hilfe & Spielregeln</button></footer></div></main>';}

r.available?'':'disabled')+'</section><h2 class="mt24 mb16">Deine Teamgebäude</h2><div class="offer-grid">'+M.facilityOffers(S).map(o=>'<section class="panel"><div class="panel-header"><h3>'+esc(o.name)+'</h3>'+badge(o.level+' / 3','dim')+'</div><p class="muted mb16" style="font-size:12px;line-height:1.8">'+esc(o.text)+'</p>'+progress(o.level/3*100)+pair('Einmaliger Ausbau',o.level>=3?'Voll ausgebaut':esc(compactMoney(o.cost)))+pair('Wartung aktuell / Jahr',esc(compactMoney(o.level*o.upkeep)))+(o.level<3?pair('Zusätzliche Wartung / Jahr','+ '+esc(compactMoney(o.upkeep))):'')+btn(o.level>=3?'Voll ausgebaut':o.available?'Gebäude ausbauen':'Budget / Phase prüfen','facility',o.id,'secondary full mt16',o.available?'':'disabled')+'</section>').join('')+'</div><div class="notice info mt24">'+icon('info')+'<div>Ein hohes Budget allein garantiert keinen Titel. Gute Autos werden langsamer besser, Rivalen entwickeln aktiv weiter und alle vier Saisons ändern sich die Regeln. Gebäudewartung läuft jedes Jahr weiter. Niemand bucht die Ausbaurechnung ein zweites Mal ab.</div></div><div class="mt24">'+forecastPanel()+'</div>';

function contractQuote(resetSalary=false){const d=S.drivers.find(d=>d.id===editDriver),slot=Number($('#m-slot').value),years=Number($('#m-years').value);try{const q=M.quote(S,d.id,slot,years,$('#m-role')?.value||'equal'),t=q.contractTerms;if(resetSalary)$('#m-salary').value=(q.minSalary/1000000).toFixed(2);const salary=Math.round(Number($('#m-salary').value)*1000000);$('#m-quote').innerHTML=pair('Mindest-Jahresgehalt',esc(compactMoney(q.minSalary)))+pair('Ablöse an bisheriges Team',esc(compactMoney(q.buyout)))+pair('Handgeld an Fahrer',esc(compactMoney(q.signing)))+(q.replacedName?pair('Vertragsauflösung: '+esc(q.replacedName),esc(compactMoney(q.compensation))):'')+pair('Teamrolle',esc(roleName($('#m-role')?.value||'equal')))+pair('Zielbonus',esc(compactMoney(t.bonus.target)))+pair('Titelbonus',esc(compactMoney(t.bonus.title)))+pair('Fahrerklausel',esc(t.driverClauseLabel))+pair('Teamklausel',esc(t.teamClauseLabel))+pair('Ablösewert im neuen Vertrag',esc(compactMoney(t.releaseValue)))+pair('<b>Sofort fällig</b>',esc(compactMoney(q.total)))+pair('Gehalt über '+years+' '+(years===1?'Saison':'Saisons'),esc(compactMoney(Number.isFinite(salary)?salary*years:0)))+'<p class="faint">Gehalt und mögliche Boni werden pro Saison abgerechnet. Mehrjahresverträge sind bindend; ein vorzeitiger Wechsel braucht eine Klausel oder Ablöse.</p>';$('#m-contract-error').textContent=q.willing?'':('Noch keine Einigung: '+q.reasons.join(' · '));$('#m-quote').insertAdjacentHTML('afterbegin','<p class="muted">'+esc(q.description)+'</p><p><b>'+esc(q.willing?'Der Fahrer ist mit Rolle, Laufzeit und Perspektive einverstanden.':'Sportliche Forderungen noch nicht erfüllt.')+'</b></p>');const submit=document.querySelector('button[form="m-contract-form"]');if(submit)submit.disabled=!q.willing;}catch(e){$('#m-quote').textContent=e.message;}}
